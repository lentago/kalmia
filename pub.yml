---
# ============================================================================
# Provision the pub LXC (114, pve4) — Morning Brief publish relay.
# Self-provisioning, same as site.yml: run this ON the container.
#
#   ansible-playbook -i inventory/hosts.yml pub.yml
#
# Caddy — the webserver pub actually serves http://pub.lan/ through — has its
# config (Caddyfile + sortable listing template) managed by the role since
# kalmia#144; the package itself is still hand-installed (kalmia#54).
# ============================================================================
- name: Provision the pub LXC Morning Brief publisher
  hosts: all
  gather_facts: true
  become: false

  roles:
    - role: pub
      tags: [pub, morning_brief]
