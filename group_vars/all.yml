---
# ============================================================================
# Global configuration — applies to every profile unless a profile file
# (profiles/<name>.yml) or the OS-family map (vars/<family>.yml) overrides it.
# ============================================================================

# --- Tool versions (pin here; bump in one place) ---------------------------
go_version: "1.23.6"
# sha256 from: go.dev/dl/?mode=json, the linux-amd64 tarball (kalmia#259).
# Bump it with go_version here (this file wins), then mirror both in
# roles/languages/defaults/main.yml.
go_sha256: "9379441ea310de000f33a4dc767bd966e72ab2826270e038e78b2c53c2e7802d"
nvm_version: "v0.40.1"
# sha256 of nvm's install.sh at nvm_version (computed; nvm publishes none).
nvm_install_sha256: "abdb525ee9f5b48b34d8ed9fc67c6013fb0f659712e401ecd88ab989b3af8f53"

# nvm's installer picks $XDG_CONFIG_HOME/nvm over ~/.nvm whenever
# XDG_CONFIG_HOME is set (true on Crostini). Pin NVM_DIR explicitly so the
# installer, the idempotency guards, and the .bashrc block all agree on one
# location regardless of the environment.
nvm_dir: "{{ ansible_env.HOME }}/.nvm"

# --- Feature toggles (profiles override these) -----------------------------
docker_install: true
docker_daemon: true            # false → CLI-only (Crostini)
install_vscode: true
install_claude_code: true
clone_repos: true              # needs gh auth or GH_TOKEN in the env

# Whether an unauthenticated gh is a hard failure when clone_repos is on.
# Default false: now that cloning is on by default, a pristine first run — where
# the repos role installs gh and nobody has logged in yet — must still finish
# clean. The skip is reported loudly instead of aborting the build. Set true on a
# box that is expected to be authenticated and where cloning nothing is a bug.
repos_require_gh_auth: false

# Upgrade all installed packages during a run. Default true preserves the
# historical behavior; set false to converge configuration without touching
# installed package versions.
base_system_upgrade: true

# --- GitHub / repo cloning -------------------------------------------------
# github_org defaults to the Lentago org because that is where the work repos
# live. Left empty it isn't an inert default: the org list/clone tasks are
# guarded on it, so the role cloned personal repos only and still reported a
# clean run. Export GITHUB_ORG to point a box somewhere else.
github_user: "{{ lookup('env', 'GITHUB_USER') | default('', true) }}"
github_org: "{{ lookup('env', 'GITHUB_ORG') | default('lentago', true) }}"
# Defaults to the Lentago org so the rendered config actually sets something and
# the ghnew/ghclone aliases exist. Export GITHUB_DEFAULT_OWNER to override.
github_default_owner: "{{ lookup('env', 'GITHUB_DEFAULT_OWNER') | default('lentago', true) }}"
# Clones are owner-grouped: {{ repos_dir }}/<owner>/<name> (e.g. repos/lentago/kalmia,
# repos/cpitzi/theoria) — the fleet layout since 2026-08-12 (kalmia#126).
repos_dir: "{{ ansible_env.HOME }}/repos"
repos_dir_aliases:
  ".github": dotgithub          # org meta-repo; a hidden dir is no fun
repos_skip: []

# --- Git identity (auto-pulled from the gh profile when left empty) ---------
git_user_name: "{{ lookup('env', 'GIT_NAME') | default('', true) }}"
git_user_email: "{{ lookup('env', 'GIT_EMAIL') | default('', true) }}"

git_config_global:
  init.defaultBranch: main
  pull.rebase: "true"
  push.autoSetupRemote: "true"
  core.editor: nano

git_aliases:
  st: status -sb
  lg: log --oneline --graph --decorate -20
  co: checkout
  br: branch
  unstage: reset HEAD --
  amend: commit --amend --no-edit
  wip: "!git add -A && git commit -m 'WIP'"

# User-wide ignore file (~/.config/git/ignore), written whole by the common role.
# Local files no repo should track, so a clone reads clean at session end
# (#316). A leading / anchors to each repo's root; tracked files are unaffected.
git_global_ignore:
  - /AGENTS.md                       # Codex / Gemini CLI instructions, local only
  - /.agents/
  - /.codex/
  - "**/.claude/settings.local.json*"  # Claude Code local settings and their backups
  - "**/.claude/worktrees/"            # subagent worktrees

# --- VS Code extensions ----------------------------------------------------
vscode_extensions:
  - hashicorp.terraform
  - hashicorp.hcl
  - ms-azuretools.vscode-docker
  - amazonwebservices.aws-toolkit-vscode
  - ms-python.python
  - golang.go
  - anthropic.claude-code
  - redhat.vscode-yaml
  - eamodio.gitlens
  - timonwong.shellcheck
  - ms-vscode-remote.remote-ssh

# --- Quality-of-life packages with identical names across families ---------
# (family-specific names — bat, fd, ripgrep, shellcheck — live in vars/<family>.yml)
qol_packages:
  - jq
  - tree
  - tmux
  - direnv
