# ============================================================================
# Claude Code — Automated PR Review (advisory)
# ============================================================================
# Thin wrapper around lentago/shared-workflows/claude-review.yml, per
# lentago/.github ADR-0013. This file is copied from repo-template's
# `claude-review.yml`; only the review_prompt differs.
#
# - Runs when a PR is opened or marked ready for review, and again when it is
#   labelled `re-review` (Haiku) or `review:sonnet` (Sonnet). It does NOT run on
#   every push: it shares the fleet's Claude subscription with the bullpen.
# - Advisory, never a required status check (shared-workflows ADR-0003). The
#   gate is the arming rule: don't arm until a review has posted and every
#   finding is triaged on the PR (shared-workflows CLAUDE.md, Auto-merge
#   arming). A "could not complete" soft-fail comment is not a review —
#   label `re-review`.
# - After a labelled run, `clear-label` removes the label so adding it again
#   triggers again.
# - A PR that adds or changes THIS file is not reviewed by it: the Claude Code
#   action skips unless the workflow is identical to the default branch's copy,
#   and the reusable workflow (v1.5.0+) posts a "not a review" notice instead.
#   Review such PRs locally and post the result as "Review (Haiku, local)"
#   (ADR-0013 Decision 2).
# - Dependabot PRs are skipped: Dependabot runs don't receive Actions secrets,
#   so the required token would fail the call. Review a bump locally if it
#   warrants one.
# - Drafts are skipped (by the reusable workflow) and keep their trigger label
#   until they are ready.
# ============================================================================

name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

jobs:
  review:
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 're-review' ||
       github.event.label.name == 'review:sonnet')
    # One review at a time per PR: a re-label during a running review queues
    # behind it instead of posting a duplicate.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: lentago/shared-workflows/.github/workflows/claude-review.yml@v1.5.0
    secrets: inherit
    with:
      model: ${{ github.event.label.name == 'review:sonnet' && 'sonnet' || 'haiku' }}
      review_prompt: |
        This repository is lentago/kalmia, the Lentago Labs provisioning system
        for workstations, VMs and containers. Ansible (repo root: roles,
        profiles, the site/pub/lunaria/pe-publish/pve-host playbooks,
        bootstrap.sh) owns what is inside a machine's OS; Terraform
        (`terraform/`, bpg/proxmox) owns Proxmox guest existence and shape and
        is applied from CI on merge. Focus your review on:

        - **Idempotency**: every task must be safe to re-run. Flag missing
          `creates:`/`stat` guards, `command`/`shell` tasks without
          `changed_when`/`failed_when`, and modules used non-idempotently.
          Use FQCN (`ansible.builtin.*`) throughout.
        - **Privilege model and profile parity**: the play runs
          `become: false`; system tasks opt into `become: true`, user-space
          steps use `target_user`/`target_home`, never root's `$HOME`. Behavior
          belongs in profile toggles (`profiles/`) and family vars (`vars/`),
          not hard-coded in a role, and a change to one of the five profiles
          (crostini, baguette, xubuntu, fedora, ubuntu_laptop) should be
          reflected in the others, adapted per package manager. Server
          playbooks (pub, lunaria, pe-publish) stay standalone rather than
          becoming desktop profiles.
        - **Terraform live-apply safety**: a merge to `main` applies
          `terraform/**` to the real cluster. Flag anything that would destroy
          or recreate a guest, drift from the `homelab-cluster` state, touch VM
          100 (HAOS) or the `exclude = ["100"]` backup rule, or reclaim the
          bullpen runner pool (110-112, 116-117), which claytonia owns. Check
          VMIDs, template and datastore conventions, and bind mounts (which go
          through the allowlisted mount hook, not the API token).
        - **Secrets and trust**: nothing secret is committed (no vault
          precedent; credentials such as the rclone config or runner
          registration token are seeded by hand or via the environment, e.g.
          `GH_TOKEN`). Third-party apt/dnf repos need signed-by keyrings, piped
          installers need care, and downloaded binaries should be pinned.
          Generated service units, mediamtx auth and Caddy config must not widen
          access.
        - **Rendered config and services**: Jinja templates for systemd units,
          Caddyfile and mediamtx should render valid output (watch whitespace
          and trim_blocks effects), handlers should restart what changed, and
          paths on pub.lan (the NAS web share) should match the docs.
        - **CI and docs**: workflow changes must keep the five required checks
          (`gate`, `ansible-lint`, `shellcheck / shellcheck`,
          `docs-check / docs-check`, `tf-lint / tf-lint`) able to run on every
          PR, and relative markdown links in docs must resolve. Flag stale
          claims in CLAUDE.md or `docs/` that a change makes untrue.

  clear-label:
    needs: review
    if: >-
      always() && github.event.action == 'labeled' &&
      github.event.pull_request.draft == false &&
      (github.event.label.name == 're-review' || github.event.label.name == 'review:sonnet')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the trigger label so it can be added again
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
        # REST, not `gh pr edit`: the GraphQL path can trip on PR project
        # fields with GITHUB_TOKEN, and a label left behind would make the
        # next re-add a no-op (no `labeled` event).
        run: |
          enc=$(jq -rn --arg l "$LABEL" '$l|@uri')
          gh api --method DELETE "repos/$REPO/issues/$PR/labels/$enc" >/dev/null
