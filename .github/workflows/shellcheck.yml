# ============================================================================
# ShellCheck — static analysis of every tracked *.sh (bootstrap.sh, forge/runner/*.sh).
# Thin wrapper around lentago/shared-workflows/shellcheck.yml. No `scripts`
# input → discovers all *.sh files in the repo.
# ============================================================================
name: ShellCheck

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  shellcheck:
    uses: lentago/shared-workflows/.github/workflows/shellcheck.yml@v1.2.3
