---
# ============================================================================
# repos — GitHub CLI + clone personal and org repositories.
# Clones land owner-grouped — {{ repos_dir }}/<owner>/<name> — with
# repos_dir_aliases renaming awkward names (.github → dotgithub) and repos_skip
# holding names back. Existing checkouts are never touched (update: false).
# On by default (clone_repos); set it false to skip the role entirely. Needs gh
# already authenticated or GH_TOKEN in the environment — without that, cloning
# is skipped with a loud notice rather than aborting the run, unless
# repos_require_gh_auth is true.
# ============================================================================
- name: Install GitHub CLI from the official apt repository (Debian)
  when: ansible_os_family == "Debian"
  become: true
  block:
    - name: Ensure the apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add the GitHub CLI GPG key
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        mode: "0644"

    - name: Add the GitHub CLI apt repository
      ansible.builtin.deb822_repository:
        name: github-cli
        types: [deb]
        uris: https://cli.github.com/packages
        suites: stable
        components: [main]
        architectures: "{{ deb_arch }}"
        signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        state: present

    - name: Install gh
      ansible.builtin.apt:
        name: gh
        state: present
        update_cache: true

- name: Check GitHub CLI auth status
  ansible.builtin.command: gh auth status
  register: gh_auth
  changed_when: false
  failed_when: false
  check_mode: false
  become: false
  environment:
    GH_TOKEN: "{{ lookup('env', 'GH_TOKEN') | default('', true) }}"

# An unauthenticated gh used to be a silent skip: the block below was gated on
# gh_auth.rc and the play went green having cloned nothing. Now that clone_repos
# defaults to true, aborting instead would break the pristine first run, where
# this role installs gh and nobody has logged in yet. So: skip, but say so
# unmissably. Set repos_require_gh_auth=true to make it fatal on a box that is
# supposed to be authenticated.
- name: Require an authenticated GitHub CLI
  ansible.builtin.assert:
    that: gh_auth.rc == 0
    fail_msg: >-
      clone_repos is true but the GitHub CLI is not authenticated. Run
      `gh auth login`, or export GH_TOKEN, and re-run.
    success_msg: GitHub CLI is authenticated
    quiet: true
  when: repos_require_gh_auth | bool

- name: Report that cloning was skipped
  ansible.builtin.debug:
    msg: >-
      SKIPPED cloning — the GitHub CLI is not authenticated, so NO repositories
      were cloned. Run `gh auth login` (or export GH_TOKEN), then re-run with
      --tags repos. Set repos_require_gh_auth=true to make this a hard failure.
  when: gh_auth.rc != 0

- name: Clone repositories
  when: gh_auth.rc == 0
  become: false
  environment:
    GH_TOKEN: "{{ lookup('env', 'GH_TOKEN') | default('', true) }}"
  block:
    - name: Configure git to use gh credentials
      ansible.builtin.command: gh auth setup-git
      changed_when: false

    - name: Resolve the GitHub user when not set explicitly
      ansible.builtin.command: gh api user -q .login
      register: gh_user_cmd
      changed_when: false
      check_mode: false
      when: github_user | length == 0

    - name: Set the effective GitHub user
      ansible.builtin.set_fact:
        effective_github_user: "{{ github_user if (github_user | length > 0) else gh_user_cmd.stdout }}"

    # No mode: pre-existing directories keep whatever permissions they have.
    - name: Ensure the repos directory and owner subdirectories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop: >-
        {{ [repos_dir, repos_dir ~ '/' ~ effective_github_user]
           + ([repos_dir ~ '/' ~ github_org] if (github_org | length > 0) else []) }}

    - name: List personal repositories
      ansible.builtin.command: "gh repo list {{ effective_github_user }} --limit 200 --json name -q .[].name"
      register: personal_repos
      changed_when: false
      check_mode: false

    # `update: false` is deliberate, not an oversight. With `version: HEAD` the
    # git module updates by running `git reset --hard origin/<current-branch>`,
    # which discards unpushed local commits on whatever branch the checkout
    # happens to be sitting on — verified destroying one on a feature branch
    # that tracked a remote. This role clones; `pull-all` (shell role) updates.
    - name: Clone personal repositories
      ansible.builtin.git:
        repo: "https://github.com/{{ effective_github_user }}/{{ item }}.git"
        dest: "{{ repos_dir }}/{{ effective_github_user }}/{{ repos_dir_aliases.get(item, item) }}"
        version: HEAD
        update: false
      loop: "{{ personal_repos.stdout_lines | reject('in', repos_skip) | list }}"
      register: personal_clone
      ignore_errors: true

    - name: Fail when a personal repository could not be cloned
      ansible.builtin.assert:
        that:
          - personal_clone.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
        fail_msg: >-
          Could not clone
          {{ personal_clone.results | default([]) | selectattr('failed', 'defined') | selectattr('failed')
             | map(attribute='item') | join(', ') }}
        success_msg: >-
          {{ personal_repos.stdout_lines | reject('in', repos_skip) | list | length }} personal repositories present
        quiet: true

    - name: List organization repositories
      ansible.builtin.command: "gh repo list {{ github_org }} --limit 200 --json name -q .[].name"
      register: org_repos
      changed_when: false
      check_mode: false
      when: github_org | length > 0

    - name: Clone organization repositories
      ansible.builtin.git:
        repo: "https://github.com/{{ github_org }}/{{ item }}.git"
        dest: "{{ repos_dir }}/{{ github_org }}/{{ repos_dir_aliases.get(item, item) }}"
        version: HEAD
        update: false
      loop: "{{ org_repos.stdout_lines | default([]) | reject('in', repos_skip) | list }}"
      register: org_clone
      ignore_errors: true
      when: github_org | length > 0

    - name: Fail when an organization repository could not be cloned
      ansible.builtin.assert:
        that:
          - org_clone.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
        fail_msg: >-
          Could not clone
          {{ org_clone.results | default([]) | selectattr('failed', 'defined') | selectattr('failed')
             | map(attribute='item') | join(', ') }}
        success_msg: >-
          {{ org_repos.stdout_lines | default([]) | reject('in', repos_skip) | list | length }} {{ github_org }} repositories present
        quiet: true
      when: github_org | length > 0
