---
# claude_transcripts — betula's Claude Code transcript client (lentago/betula
# clients/claude-code, ADR-0008; rollout tracked in lentago/betula#161).
# Gated by `claude_transcripts` in group_vars/all.yml.

# betula commit the client is installed from. A full sha, not a branch: a
# rebuild must install the reviewed code, and a bump is a reviewed kalmia PR.
# b4879c9 = betula main after #160 (client) and #162 (surface semantics).
claude_transcripts_version: "b4879c9eb0caa3728b70ea19c55986059928ae28"
claude_transcripts_repo: "https://github.com/lentago/betula.git"
claude_transcripts_src: /opt/betula/src
# install.sh's paths. The managed-settings drop-in calls
# <dest>/cc-transcripts, so moving this means changing the hook in betula too.
claude_transcripts_dest: /opt/betula/claude-code
claude_transcripts_dropin_dir: /etc/claude-code/managed-settings.d
claude_transcripts_dropin: 60-betula-transcripts.json

# Hand-placed, never in git: Loki credentials and the archive dir. Ansible
# creates the directory, never the file. With no file, both sinks are off and
# the hook does nothing.
claude_transcripts_env_file: /etc/betula/claude-code.env
claude_transcripts_state_dir: "{{ target_home }}/.local/state/betula-cc"

# Catch-up sync for sessions that stopped firing hooks (killed, or closed while
# the NAS was away). 15 minutes keeps stragglers inside the 1-hour window Loki
# still accepts (BETULA_CC_LOKI_MAX_AGE_S); older lines go to the archive only.
claude_transcripts_sync_interval: 15min
claude_transcripts_sync_days: 2
