---
# ============================================================================
# power — TLP power management + ThinkPad charge thresholds + fwupd firmware
# updates. Opt-in via enable_tlp (only the bare-metal ubuntu_laptop profile);
# the whole role is gated in site.yml. TLP and power-profiles-daemon are
# mutually exclusive, so PPD is masked when present. Package names come from
# the OS-family var map, so the role stays package-manager-agnostic.
# ============================================================================
- name: Install TLP
  ansible.builtin.package:
    name: "{{ tlp_packages }}"
    state: present
  become: true

- name: Collect service facts
  ansible.builtin.service_facts:
  become: true

- name: Mask power-profiles-daemon (mutually exclusive with TLP)
  ansible.builtin.systemd_service:
    name: power-profiles-daemon
    state: stopped
    masked: true
  become: true
  when: "'power-profiles-daemon.service' in (ansible_facts.services | default({}))"

- name: Write the ThinkPad charge-threshold drop-in
  ansible.builtin.template:
    src: charge-thresholds.conf.j2
    dest: /etc/tlp.d/01-charge-thresholds.conf
    mode: "0644"
  become: true
  when:
    - tlp_start_charge_threshold is not none
    - tlp_stop_charge_threshold is not none
  notify: Restart TLP

# The workstation-bootstrap predecessor wrote the same settings to
# 01-thinkpad-charge-thresholds.conf, which sorts after ours in TLP's lexical
# /etc/tlp.d/*.conf read order and silently wins. Converge already-provisioned
# hosts by dropping the leftover once ours is confirmed present (#83).
- name: Check for the managed charge-threshold drop-in
  ansible.builtin.stat:
    path: /etc/tlp.d/01-charge-thresholds.conf
  register: tlp_managed_charge_thresholds

- name: Check for the predecessor's charge-threshold drop-in
  ansible.builtin.stat:
    path: /etc/tlp.d/01-thinkpad-charge-thresholds.conf
  register: tlp_legacy_charge_thresholds

- name: Remove the predecessor's charge-threshold drop-in
  ansible.builtin.file:
    path: /etc/tlp.d/01-thinkpad-charge-thresholds.conf
    state: absent
  become: true
  when:
    - tlp_managed_charge_thresholds.stat.exists
    - tlp_legacy_charge_thresholds.stat.exists
  notify: Restart TLP

- name: Enable and start TLP
  ansible.builtin.systemd_service:
    name: tlp
    enabled: true
    state: started
  become: true

# Handlers must flush before the read-back or sysfs still holds pre-restart
# values (#85).
- name: Apply pending TLP restarts before verifying thresholds
  ansible.builtin.meta: flush_handlers

- name: Check for the battery charge-threshold sysfs nodes
  ansible.builtin.stat:
    path: "/sys/class/power_supply/{{ tlp_battery }}/{{ item }}"
  loop:
    - charge_control_start_threshold
    - charge_control_end_threshold
  register: tlp_threshold_nodes
  when:
    - not ansible_check_mode
    - tlp_start_charge_threshold is not none
    - tlp_stop_charge_threshold is not none

- name: Read back the applied start charge threshold
  ansible.builtin.slurp:
    src: "/sys/class/power_supply/{{ tlp_battery }}/charge_control_start_threshold"
  register: tlp_applied_start
  when:
    - tlp_threshold_nodes is not skipped
    - tlp_threshold_nodes.results | map(attribute='stat.exists') | min

- name: Read back the applied stop charge threshold
  ansible.builtin.slurp:
    src: "/sys/class/power_supply/{{ tlp_battery }}/charge_control_end_threshold"
  register: tlp_applied_stop
  when:
    - tlp_threshold_nodes is not skipped
    - tlp_threshold_nodes.results | map(attribute='stat.exists') | min

- name: Assert the charge thresholds reached sysfs
  ansible.builtin.assert:
    that:
      - (tlp_applied_start.content | b64decode | trim | int) == (tlp_start_charge_threshold | int)
      - (tlp_applied_stop.content | b64decode | trim | int) == (tlp_stop_charge_threshold | int)
    fail_msg: >-
      {{ tlp_battery }} charge thresholds in sysfs are
      {{ tlp_applied_start.content | b64decode | trim }}/{{ tlp_applied_stop.content | b64decode | trim }}
      (start/stop), expected {{ tlp_start_charge_threshold }}/{{ tlp_stop_charge_threshold }}.
      The drop-in was written but another file in /etc/tlp.d/ is likely
      overriding it: TLP reads /etc/tlp.d/*.conf in lexical order and the last
      file wins, so anything sorting after 01-charge-thresholds.conf takes
      precedence. Check with `tlp-stat -c`. Set tlp_assert_thresholds=false to
      report this as an ignored failure instead of stopping.
    quiet: true
  ignore_errors: "{{ not (tlp_assert_thresholds | bool) }}"
  when: tlp_applied_start is not skipped

- name: Install fwupd
  ansible.builtin.package:
    name: "{{ fwupd_package }}"
    state: present
  become: true
  when: install_fwupd | bool

- name: Enable the fwupd metadata-refresh timer
  ansible.builtin.systemd_service:
    name: fwupd-refresh.timer
    enabled: true
    state: started
  become: true
  when: install_fwupd | bool
