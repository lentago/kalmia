---
# Power management is opt-in per profile (enable_tlp); only the bare-metal
# ubuntu_laptop profile turns it on. fwupd rides along because firmware updates
# only matter on bare metal.
enable_tlp: false
install_fwupd: true

# ThinkPad battery charge thresholds (percent). TLP applies these through the
# kernel's native charge-control sysfs on supported hardware and ignores them
# elsewhere. Set either to null to skip writing the threshold drop-in.
tlp_start_charge_threshold: 75
tlp_stop_charge_threshold: 80

# Battery whose sysfs charge-control nodes the post-restart assertion reads, and
# which the drop-in's START/STOP_CHARGE_THRESH_<battery> keys target.
tlp_battery: BAT0

# After TLP restarts, read the threshold nodes back from sysfs and fail the play
# if they differ from the values above (typically another /etc/tlp.d/*.conf
# sorting after ours — TLP is last-lexical-wins). Set false to make the
# mismatch a non-fatal (ignored) failure that is still printed. Skipped regardless when the nodes are absent (VMs,
# unsupported hardware), in --check mode, or when either threshold is null.
tlp_assert_thresholds: true
