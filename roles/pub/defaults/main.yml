---
# ============================================================================
# pub — Morning Brief publish relay for the pub LXC (114, pve4). Syncs the
# claude.ai "Morning brief" routine's Google Drive output down to the web
# root Caddy serves at http://pub.lan/brief/. The caddy package itself stays
# out of scope (kalmia#54); its config is managed by this role since kalmia#144.
# ============================================================================
pub_script_path: /usr/local/bin/publish-morning-brief

# --- Caddy config (kalmia#144) -----------------------------------------------
# roles/pub/files/caddy/{Caddyfile,browse.html} are the source of truth for
# /etc/caddy on pub: the site block that serves the web share with directory
# browsing, and the listing template with sortable Name / Size / Modified
# headers. The caddy *package* (upstream apt repo) is not managed here; with the
# binary absent the block warns and skips instead of failing the play.
pub_caddy_manage_config: true
pub_rclone_config_dir: /root/.config/rclone
pub_rclone_config_path: "{{ pub_rclone_config_dir }}/rclone.conf"

# Weekdays, 08:00-11:04 America/New_York every 15 minutes. The container
# clock runs UTC — the explicit zone suffix is load-bearing.
pub_timer_oncalendar: "Mon..Fri *-*-* 08..11:04/15:00 America/New_York"

# --- Cast receiver publishing (brasenia ADR-0006, kalmia#99) ----------------
# Serves brasenia's Cast custom web receiver at http://pub.lan/cast/ — the URL
# registered in the Cast Developer Console. pub owns receiver *hosting* only;
# the receiver HTML is authored in brasenia (lentago/brasenia#13) and served
# here, never forked.
pub_cast_publish_enabled: true

# The brasenia checkout the receiver is published from. The role clones the
# public repo (credential-free https) to pub_cast_checkout, and the publisher
# does an opportunistic ff-only pull before each rsync so the served receiver
# tracks brasenia main within a day without re-running this role.
pub_cast_repo_url: https://github.com/lentago/brasenia
pub_cast_checkout: /srv/brasenia
pub_cast_receiver_src: "{{ pub_cast_checkout }}/cast-app"

# Destination on the web share pub serves. /srv/www is the NAS web share
# (/volume1/lentago/web) mounted on pub, so this is /volume1/lentago/web/cast/
# on the NAS and http://pub.lan/cast/ over HTTP.
pub_cast_receiver_dest: /srv/www/cast

# The receiver is static and changes only when brasenia does — a daily
# republish keeps the share fresh and recovers if it is remounted/cleared.
pub_cast_timer_oncalendar: "*-*-* 06:00:00 America/New_York"

# --- brasenia viewport runtime (kalmia#140, brasenia#26 Phase 2) ------------
# Runs brasenia's two long-running viewport programs from the same checkout:
# the compositor (ranks the pane bus, writes viewport/current.json) and the
# focus producer (session beacons → open-PR panes). Both are stdlib Python and
# credential-free, and read/write only under <webroot>/viewport on the share —
# which is why they live here and not on LXC 118 (no NAS mount by design).
# New brasenia code goes live via the publish-cast-receiver daily pull, which
# restarts both services when it moves the checkout.
pub_viewport_enabled: true
# Runtime identity. The share is a CIFS mount that forces every file to
# uid/gid 1000 at mode 0770 (see docs/pub.md), so a non-root writer needs the
# gid-1000 group; `webdrop` is that group (Caddy is in it for reads). The role
# ensures the group and a system user in it.
pub_viewport_user: brasenia
pub_viewport_group: webdrop
pub_viewport_group_gid: 1000
pub_viewport_webroot: /srv/www
pub_viewport_url_base: http://pub.lan
pub_viewport_compositor_interval: 5
pub_viewport_focus_interval: 30
