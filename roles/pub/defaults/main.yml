---
# ============================================================================
# pub — Morning Brief publish relay for the pub LXC (114, pve4). Syncs the
# claude.ai "Morning brief" routine's Google Drive output down to the web
# root Caddy serves at http://pub.lan/brief/. The caddy package itself stays
# out of scope (kalmia#54); its config is managed by this role since kalmia#144.
# ============================================================================
pub_script_path: /usr/local/bin/publish-morning-brief

# --- Caddy config (kalmia#144) -----------------------------------------------
# roles/pub/files/caddy/{Caddyfile,browse.html} are the source of truth for
# /etc/caddy on pub: the site block that serves the web share with directory
# browsing, and the listing template with sortable Name / Size / Modified
# headers. The caddy *package* (upstream apt repo) is not managed here; with the
# binary absent the block warns and skips instead of failing the play.
pub_caddy_manage_config: true
pub_rclone_config_dir: /root/.config/rclone
pub_rclone_config_path: "{{ pub_rclone_config_dir }}/rclone.conf"

# Weekdays, 08:00-11:04 America/New_York every 15 minutes. The container
# clock runs UTC — the explicit zone suffix is load-bearing.
pub_timer_oncalendar: "Mon..Fri *-*-* 08..11:04/15:00 America/New_York"

# --- Family Brief document (kalmia#163) --------------------------------------
# Syncs latest.json, written by the claude.ai "Family Brief" routine, from
# Drive to http://pub.lan/family-brief/latest.json, where brasenia's
# family-brief producer reads it. Same root rclone remote as the Morning Brief.
pub_family_brief_enabled: true
pub_family_brief_script_path: /usr/local/bin/publish-family-brief
# Folder confirmed by Chris 2026-10-26, next to the Morning Brief's folder. The
# Family Brief routine's STEP 5b writes here; change both together.
pub_family_brief_src: "Google Drive:Hobbies/Claude-Code/family-brief"
pub_family_brief_dest: /srv/www/family-brief
# Every day, weekends included, 06:00-09:45 America/New_York every 15 minutes:
# the routine runs at about 06:47, and the window leaves room for a late run.
# The container clock runs UTC, so the explicit zone suffix is load-bearing.
pub_family_brief_timer_oncalendar: "*-*-* 06..09:00/15:00 America/New_York"
# The brief as a Google Doc (#186, brasenia#90), for reading on a phone away
# from home. When a new latest.json is published, the script renders
# brasenia's document rendition as the viewport user and imports it to this
# rclone path as one Google Doc, updated in place so its link never changes
# (rclone names it after the file, without .html). Its folder is shared with
# the household by hand (docs/pub.md). Empty turns the Doc off.
pub_family_brief_doc_dest: "Google Drive:Hobbies/Claude-Code/family-brief/Family Brief/Family Brief.html"

# --- brasenia checkout and daily update (kalmia#140, #174) -------------------
# The public brasenia repo, cloned credential-free (https) to
# pub_brasenia_checkout; the viewport services below run from it.
# brasenia-update.timer pulls main (fast-forward only) on this calendar and
# restarts those services when the checkout moves, so a merge to brasenia main
# runs on pub within a day without re-running this role. (This used to ride on
# the Cast receiver publisher, retired with the Cast client: brasenia
# ADR-0010.)
pub_brasenia_repo_url: https://github.com/lentago/brasenia
pub_brasenia_checkout: /srv/brasenia
pub_brasenia_update_oncalendar: "*-*-* 06:00:00 America/New_York"

# --- brasenia viewport runtime (kalmia#140, brasenia#26 Phase 2) ------------
# Runs brasenia's two long-running viewport programs from the same checkout:
# the compositor (ranks the pane bus, writes viewport/current.json) and the
# focus producer (session beacons → open-PR panes). Both are stdlib Python and
# credential-free, and read/write only under <webroot>/viewport on the share —
# which is why they live here and not on LXC 118 (no NAS mount by design).
# New brasenia code goes live via the daily brasenia-update pull above, which
# restarts the services when it moves the checkout.
pub_viewport_enabled: true
# Runtime identity. The share is a CIFS mount that forces every file to
# uid/gid 1000 at mode 0770 (see docs/pub.md), so a non-root writer needs the
# gid-1000 group; `webdrop` is that group (Caddy is in it for reads). The role
# ensures the group and a system user in it.
pub_viewport_user: brasenia
pub_viewport_group: webdrop
pub_viewport_group_gid: 1000
pub_viewport_webroot: /srv/www
pub_viewport_url_base: http://pub.lan
pub_viewport_compositor_interval: 1
pub_viewport_focus_interval: 30
# The change-pipeline pane producer (kalmia#148, brasenia#36) reads
# http://pub.lan/viewport/pipeline.json (the Caddy route from kalmia#146) and
# keeps panes/change-pipeline/ up while a change is in flight.
pub_viewport_pipeline_interval: 15
# The family-brief pane producer (kalmia#163, brasenia#48) reads
# http://pub.lan/family-brief/latest.json and keeps panes/family-today/ up
# while the brief is dated today or yesterday.
pub_viewport_family_brief_interval: 60
# The home producer (#180, brasenia#86) reads Home Assistant's REST API and
# keeps panes/home/ and panes/weather/ up. Its long-lived token is a systemd
# credential (LoadCredential=) loaded from pub_viewport_home_token_file, a
# root-only file this role never writes: it is seeded by hand (docs/pub.md).
# Until it exists, ConditionPathExists skips the unit rather than failing it.
pub_viewport_home_ha_url: http://homeassistant.lan:8123
pub_viewport_home_token_file: /etc/brasenia/ha-token
pub_viewport_home_interval: 60
# Entity ids kept off the home pane (each becomes a --hide): the kids'
# bedroom doors, usually open, and the older, offline sensors on the same doors.
pub_viewport_home_hide:
  - binary_sensor.z_wave_door_window_sensor
  - binary_sensor.z_wave_door_window_sensor_2
  - binary_sensor.hannahsroom
  - binary_sensor.jacobsroom
# The fleet producer (#180, brasenia#86) reads the claytonia job queue through
# the read-only bind mount at pub_viewport_fleet_jobs (mp1, attached by hand:
# docs/pub.md) and keeps panes/fleet/ up.
pub_viewport_fleet_jobs: /srv/claude-jobs
pub_viewport_fleet_interval: 60
# The links producer (brasenia#97, ADR-0018) reads the household's standing
# slots from viewport/rubric.json and keeps one link pane on the bus per slot.
# Its seconds between cycles: how long a slot added in the configurator takes
# to reach the bus.
pub_viewport_links_interval: 30

# --- Signal sink (kalmia#165) -----------------------------------------------
# pub-signals takes checkbox actions from pages served here:
# POST http://pub.lan/api/signals/<namespace> {"id", "action", "label"} appends
# one JSON line to /srv/www/signals/<namespace>.jsonl, and GET on the same path
# returns the latest action per id. stdlib Python and credential-free, like the
# viewport programs; it writes through the share's gid-1000 group (the viewport
# group vars above), so a non-root user in that group is all it needs.
pub_signals_enabled: true
pub_signals_script_path: /usr/local/bin/pub-signals
pub_signals_user: pub-signals
pub_signals_webroot: /srv/www
# Bound to 127.0.0.1. The Caddyfile's /api/signals route hard-codes this port
# (roles/pub/files/caddy/Caddyfile is a static file), so change the two together.
pub_signals_port: 8620
# Allowlists: a POST to any other namespace, or with any other action, is
# refused. pe-wiki is the first client, a private wiki's checklist that a
# Claude Code session on the workstation polls from the share. rubric is the
# brasenia viewport configurator (viewport/configure.html): `set` records a
# rubric setting with its value in `label`, `undo` returns it to the default,
# and the brasenia compositor applies the latest per setting
# (lentago/brasenia ADR-0011).
pub_signals_namespaces:
  - pe-wiki
  - rubric
pub_signals_actions:
  - dismiss
  - undo
  - set
