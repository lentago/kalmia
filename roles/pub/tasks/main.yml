---
# ============================================================================
# pub — installs rclone, deploys the publish-morning-brief script + systemd
# oneshot/timer pair, and prepares the rclone secret directory. The
# rclone.conf OAuth remote is credential material and is deliberately never
# written by this role — see docs/pub.md for the manual seeding step.
# ============================================================================
- name: Install rclone, rsync, git, and python3
  ansible.builtin.apt:
    name:
      - rclone
      - rsync
      - git
      - python3
    state: present
    update_cache: true
  become: true

- name: Deploy the publish-morning-brief script
  ansible.builtin.copy:
    src: publish-morning-brief
    dest: "{{ pub_script_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy the publish-morning-brief systemd service
  ansible.builtin.copy:
    src: publish-morning-brief.service
    dest: /etc/systemd/system/publish-morning-brief.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy the publish-morning-brief systemd timer
  ansible.builtin.template:
    src: publish-morning-brief.timer.j2
    dest: /etc/systemd/system/publish-morning-brief.timer
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Enable and start the publish-morning-brief timer
  ansible.builtin.systemd_service:
    name: publish-morning-brief.timer
    daemon_reload: true
    enabled: true
    state: started
  become: true

- name: Ensure the rclone config directory exists
  ansible.builtin.file:
    path: "{{ pub_rclone_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Check whether the rclone secret has been seeded
  ansible.builtin.stat:
    path: "{{ pub_rclone_config_path }}"
  become: true
  register: pub_rclone_config

- name: Enforce restrictive permissions on the rclone secret when present
  ansible.builtin.file:
    path: "{{ pub_rclone_config_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  when: pub_rclone_config.stat.exists

- name: Warn when the rclone credential has not been seeded
  ansible.builtin.debug:
    msg: >-
      {{ pub_rclone_config_path }} is missing. This role never writes
      credential material — seed it manually per docs/pub.md before relying
      on the timers; publish-morning-brief and publish-family-brief fail
      until then.
  when: not pub_rclone_config.stat.exists

# ---------------------------------------------------------------------------
# Family Brief document (kalmia#163) — syncs latest.json from the routine's
# Drive folder to http://pub.lan/family-brief/latest.json for brasenia's
# family-brief producer. Uses the same root rclone remote as the Morning
# Brief; this block writes no credential material either.
# ---------------------------------------------------------------------------
- name: Deploy the publish-family-brief script
  ansible.builtin.copy:
    src: publish-family-brief
    dest: "{{ pub_family_brief_script_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  when: pub_family_brief_enabled

- name: Render the publish-family-brief environment file
  ansible.builtin.template:
    src: publish-family-brief.env.j2
    dest: /etc/default/publish-family-brief
    owner: root
    group: root
    mode: "0644"
  become: true
  when: pub_family_brief_enabled

- name: Deploy the publish-family-brief systemd service
  ansible.builtin.copy:
    src: publish-family-brief.service
    dest: /etc/systemd/system/publish-family-brief.service
    owner: root
    group: root
    mode: "0644"
  become: true
  when: pub_family_brief_enabled

- name: Deploy the publish-family-brief systemd timer
  ansible.builtin.template:
    src: publish-family-brief.timer.j2
    dest: /etc/systemd/system/publish-family-brief.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  when: pub_family_brief_enabled

- name: Enable and start the publish-family-brief timer
  ansible.builtin.systemd_service:
    name: publish-family-brief.timer
    daemon_reload: true
    enabled: true
    state: started
  become: true
  when: pub_family_brief_enabled

# ---------------------------------------------------------------------------
# brasenia checkout and its daily update (kalmia#140, #174). The viewport
# services below run from this checkout; brasenia-update keeps it on main and
# restarts them when it moves.
# ---------------------------------------------------------------------------
- name: Check out brasenia for the viewport runtime
  ansible.builtin.git:
    repo: "{{ pub_brasenia_repo_url }}"
    dest: "{{ pub_brasenia_checkout }}"
    version: main
    update: true
  become: true
  when: pub_viewport_enabled
  notify: Restart brasenia viewport services

- name: Deploy the brasenia-update script
  ansible.builtin.copy:
    src: brasenia-update
    dest: /usr/local/bin/brasenia-update
    owner: root
    group: root
    mode: "0755"
  become: true
  when: pub_viewport_enabled

- name: Deploy the brasenia-update systemd service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - brasenia-update.service
    - brasenia-update.timer
  become: true
  when: pub_viewport_enabled

- name: Enable and start the brasenia-update timer
  ansible.builtin.systemd_service:
    name: brasenia-update.timer
    daemon_reload: true
    enabled: true
    state: started
  become: true
  when: pub_viewport_enabled

# Retired Cast receiver publishing (brasenia ADR-0010, #174; it was #99). The
# Chromecast client is gone, so this makes sure the publisher the role used to
# install is absent: timer and service stopped and disabled, units, script and
# env file removed, and the published page at http://pub.lan/cast/ deleted from
# the share. Idempotent; a host built after the retirement has nothing to remove.
- name: Check for the retired Cast receiver publisher
  ansible.builtin.stat:
    path: /etc/systemd/system/publish-cast-receiver.timer
  register: pub_cast_timer

- name: Stop and disable the retired Cast receiver publisher
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - publish-cast-receiver.timer
    - publish-cast-receiver.service
  become: true
  when: pub_cast_timer.stat.exists

- name: Remove the retired Cast receiver publisher and its published page
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/publish-cast-receiver.timer
    - /etc/systemd/system/publish-cast-receiver.service
    - /usr/local/bin/publish-cast-receiver
    - /etc/default/publish-cast-receiver
    - "{{ pub_viewport_webroot }}/cast"
  become: true
  notify: Reload systemd

# ---------------------------------------------------------------------------
# brasenia viewport runtime (kalmia#140, brasenia#26 Phase 2) — the compositor
# and producers, run from the checkout above as the unprivileged
# `brasenia` system user. The share forces uid/gid 1000 and mode 0770 on every
# file, so membership of the gid-1000 `webdrop` group is what grants writes
# (the same group Caddy reads through); the role leaves ownership and mode of
# the viewport directories to the share rather than forcing either.
# ---------------------------------------------------------------------------
- name: Ensure the share's gid-1000 group exists
  ansible.builtin.group:
    name: "{{ pub_viewport_group }}"
    gid: "{{ pub_viewport_group_gid }}"
    system: true
  become: true
  when: pub_viewport_enabled

- name: Ensure the brasenia viewport service user exists
  ansible.builtin.user:
    name: "{{ pub_viewport_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    groups: "{{ pub_viewport_group }}"
    append: true
  become: true
  when: pub_viewport_enabled
  notify: Restart brasenia viewport services

- name: Ensure the viewport bus directories exist on the web share
  ansible.builtin.file:
    path: "{{ pub_viewport_webroot }}/viewport/{{ item }}"
    state: directory
  loop:
    - panes
    - focus
    - state
  become: true
  when:
    - pub_viewport_enabled
    - pub_viewport_webroot in (ansible_facts.mounts | map(attribute='mount'))

- name: Warn when the web share is not mounted
  ansible.builtin.debug:
    msg: >-
      {{ pub_viewport_webroot }} is not a mount point, so the viewport
      directories were not created. The brasenia services skip on their
      ConditionPathIsMountPoint until the NAS share is mounted.
  when:
    - pub_viewport_enabled
    - pub_viewport_webroot not in (ansible_facts.mounts | map(attribute='mount'))

- name: Ensure the home producer's credential directory exists (root-only)
  # Holds pub_viewport_home_token_file, which is seeded by hand and never by
  # this role (docs/pub.md); systemd hands it to brasenia-home alone.
  ansible.builtin.file:
    path: "{{ pub_viewport_home_token_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  when: pub_viewport_enabled

- name: Deploy the brasenia viewport systemd services
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop:
    - brasenia-compositor
    - brasenia-focus
    - brasenia-pipeline
    - brasenia-family-brief
    - brasenia-home
    - brasenia-fleet
  become: true
  when: pub_viewport_enabled
  notify: Restart brasenia viewport services

- name: Enable and start the brasenia viewport services
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    daemon_reload: true
    enabled: true
    state: started
  loop:
    - brasenia-compositor
    - brasenia-focus
    - brasenia-pipeline
    - brasenia-family-brief
    - brasenia-home
    - brasenia-fleet
  become: true
  when: pub_viewport_enabled

# ---------------------------------------------------------------------------
# Signal sink (kalmia#165) — pub-signals takes small JSON POSTs from pages
# served here (a checkbox ticked or cleared) at /api/signals/<namespace>,
# proxied by Caddy from the route in the Caddyfile below, and appends them to
# signals/<namespace>.jsonl on the share for whatever acts on them. Bound to
# localhost, so the Caddy route is the only way in. Runs as its own system user
# in the share's gid-1000 group, the same write path the viewport programs use.
# ---------------------------------------------------------------------------
- name: Ensure the share's gid-1000 group exists for the signal sink
  ansible.builtin.group:
    name: "{{ pub_viewport_group }}"
    gid: "{{ pub_viewport_group_gid }}"
    system: true
  become: true
  when: pub_signals_enabled

- name: Ensure the signal sink service user exists
  ansible.builtin.user:
    name: "{{ pub_signals_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    groups: "{{ pub_viewport_group }}"
    append: true
  become: true
  when: pub_signals_enabled
  notify: Restart pub-signals

- name: Deploy the pub-signals script
  ansible.builtin.copy:
    src: pub-signals
    dest: "{{ pub_signals_script_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  when: pub_signals_enabled
  notify: Restart pub-signals

- name: Ensure the signals directory exists on the web share
  ansible.builtin.file:
    path: "{{ pub_signals_webroot }}/signals"
    state: directory
  become: true
  when:
    - pub_signals_enabled
    - pub_signals_webroot in (ansible_facts.mounts | map(attribute='mount'))

- name: Deploy the pub-signals systemd service
  ansible.builtin.template:
    src: pub-signals.service.j2
    dest: /etc/systemd/system/pub-signals.service
    owner: root
    group: root
    mode: "0644"
  become: true
  when: pub_signals_enabled
  notify: Restart pub-signals

- name: Enable and start pub-signals
  ansible.builtin.systemd_service:
    name: pub-signals.service
    daemon_reload: true
    enabled: true
    state: started
  become: true
  when: pub_signals_enabled

# ---------------------------------------------------------------------------
# Caddy config (kalmia#144) — the Caddyfile and the directory-listing template
# that make http://pub.lan/ a browsable, sortable index of the web share. Only
# the *config* is managed here: the caddy package comes from the upstream apt
# repo and is still installed by hand (docs/pub.md), so this block warns and
# skips when the binary is absent rather than failing the play. The template
# is deployed before the Caddyfile because `caddy validate` provisions the
# file server, which parses the template the Caddyfile points at.
# ---------------------------------------------------------------------------
- name: Check whether Caddy is installed
  ansible.builtin.stat:
    path: /usr/bin/caddy
  register: pub_caddy_bin
  when: pub_caddy_manage_config

- name: Warn when Caddy is not installed
  ansible.builtin.debug:
    msg: >-
      /usr/bin/caddy is missing, so the Caddy config was not deployed. Install
      caddy from the upstream apt repo per docs/pub.md and re-run the play.
  when:
    - pub_caddy_manage_config
    - not pub_caddy_bin.stat.exists

- name: Deploy the directory-listing template
  ansible.builtin.copy:
    src: caddy/browse.html
    dest: /etc/caddy/browse.html
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - pub_caddy_manage_config
    - pub_caddy_bin.stat.exists
  notify: Reload caddy

- name: Deploy the Caddyfile
  ansible.builtin.copy:
    src: caddy/Caddyfile
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/caddy validate --adapter caddyfile --config %s
  become: true
  when:
    - pub_caddy_manage_config
    - pub_caddy_bin.stat.exists
  notify: Reload caddy
