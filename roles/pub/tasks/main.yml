---
# ============================================================================
# pub — installs rclone, deploys the publish-morning-brief script + systemd
# oneshot/timer pair, and prepares the rclone secret directory. The
# rclone.conf OAuth remote is credential material and is deliberately never
# written by this role — see docs/pub.md for the manual seeding step.
# ============================================================================
- name: Install rclone, rsync, git, and python3
  ansible.builtin.apt:
    name:
      - rclone
      - rsync
      - git
      - python3
    state: present
    update_cache: true
  become: true

- name: Deploy the publish-morning-brief script
  ansible.builtin.copy:
    src: publish-morning-brief
    dest: "{{ pub_script_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy the publish-morning-brief systemd service
  ansible.builtin.copy:
    src: publish-morning-brief.service
    dest: /etc/systemd/system/publish-morning-brief.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy the publish-morning-brief systemd timer
  ansible.builtin.template:
    src: publish-morning-brief.timer.j2
    dest: /etc/systemd/system/publish-morning-brief.timer
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Enable and start the publish-morning-brief timer
  ansible.builtin.systemd_service:
    name: publish-morning-brief.timer
    daemon_reload: true
    enabled: true
    state: started
  become: true

- name: Ensure the rclone config directory exists
  ansible.builtin.file:
    path: "{{ pub_rclone_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Check whether the rclone secret has been seeded
  ansible.builtin.stat:
    path: "{{ pub_rclone_config_path }}"
  become: true
  register: pub_rclone_config

- name: Enforce restrictive permissions on the rclone secret when present
  ansible.builtin.file:
    path: "{{ pub_rclone_config_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  when: pub_rclone_config.stat.exists

- name: Warn when the rclone credential has not been seeded
  ansible.builtin.debug:
    msg: >-
      {{ pub_rclone_config_path }} is missing. This role never writes
      credential material — seed it manually per docs/pub.md before relying
      on the timer; publish-morning-brief will fail until then.
  when: not pub_rclone_config.stat.exists

# ---------------------------------------------------------------------------
# Cast receiver publishing (brasenia ADR-0006, kalmia#99) — serves brasenia's
# Cast custom web receiver at http://pub.lan/cast/. Additive: it touches
# nothing in the Morning Brief / brief-serving path above.
# ---------------------------------------------------------------------------
- name: Check out brasenia for the receiver source and viewport runtime
  ansible.builtin.git:
    repo: "{{ pub_cast_repo_url }}"
    dest: "{{ pub_cast_checkout }}"
    version: main
    update: true
  become: true
  when: pub_cast_publish_enabled or pub_viewport_enabled
  notify: Restart brasenia viewport services

- name: Deploy the publish-cast-receiver script
  ansible.builtin.copy:
    src: publish-cast-receiver
    dest: /usr/local/bin/publish-cast-receiver
    owner: root
    group: root
    mode: "0755"
  become: true
  when: pub_cast_publish_enabled

- name: Render the publish-cast-receiver environment file
  ansible.builtin.template:
    src: publish-cast-receiver.env.j2
    dest: /etc/default/publish-cast-receiver
    owner: root
    group: root
    mode: "0644"
  become: true
  when: pub_cast_publish_enabled

- name: Deploy the publish-cast-receiver systemd service
  ansible.builtin.copy:
    src: publish-cast-receiver.service
    dest: /etc/systemd/system/publish-cast-receiver.service
    owner: root
    group: root
    mode: "0644"
  become: true
  when: pub_cast_publish_enabled

- name: Deploy the publish-cast-receiver systemd timer
  ansible.builtin.template:
    src: publish-cast-receiver.timer.j2
    dest: /etc/systemd/system/publish-cast-receiver.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  when: pub_cast_publish_enabled

- name: Enable and start the publish-cast-receiver timer
  ansible.builtin.systemd_service:
    name: publish-cast-receiver.timer
    daemon_reload: true
    enabled: true
    state: started
  become: true
  when: pub_cast_publish_enabled

# ---------------------------------------------------------------------------
# brasenia viewport runtime (kalmia#140, brasenia#26 Phase 2) — the compositor
# and focus producer, run from the checkout above as the unprivileged
# `brasenia` system user. The share forces uid/gid 1000 and mode 0770 on every
# file, so membership of the gid-1000 `webdrop` group is what grants writes
# (the same group Caddy reads through); the role leaves ownership and mode of
# the viewport directories to the share rather than forcing either.
# ---------------------------------------------------------------------------
- name: Ensure the share's gid-1000 group exists
  ansible.builtin.group:
    name: "{{ pub_viewport_group }}"
    gid: "{{ pub_viewport_group_gid }}"
    system: true
  become: true
  when: pub_viewport_enabled

- name: Ensure the brasenia viewport service user exists
  ansible.builtin.user:
    name: "{{ pub_viewport_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    groups: "{{ pub_viewport_group }}"
    append: true
  become: true
  when: pub_viewport_enabled
  notify: Restart brasenia viewport services

- name: Ensure the viewport bus directories exist on the web share
  ansible.builtin.file:
    path: "{{ pub_viewport_webroot }}/viewport/{{ item }}"
    state: directory
  loop:
    - panes
    - focus
    - state
  become: true
  when:
    - pub_viewport_enabled
    - pub_viewport_webroot in (ansible_facts.mounts | map(attribute='mount'))

- name: Warn when the web share is not mounted
  ansible.builtin.debug:
    msg: >-
      {{ pub_viewport_webroot }} is not a mount point, so the viewport
      directories were not created. The brasenia services skip on their
      ConditionPathIsMountPoint until the NAS share is mounted.
  when:
    - pub_viewport_enabled
    - pub_viewport_webroot not in (ansible_facts.mounts | map(attribute='mount'))

- name: Deploy the brasenia viewport systemd services
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop:
    - brasenia-compositor
    - brasenia-focus
  become: true
  when: pub_viewport_enabled
  notify: Restart brasenia viewport services

- name: Enable and start the brasenia viewport services
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    daemon_reload: true
    enabled: true
    state: started
  loop:
    - brasenia-compositor
    - brasenia-focus
  become: true
  when: pub_viewport_enabled

# ---------------------------------------------------------------------------
# Caddy config (kalmia#144) — the Caddyfile and the directory-listing template
# that make http://pub.lan/ a browsable, sortable index of the web share. Only
# the *config* is managed here: the caddy package comes from the upstream apt
# repo and is still installed by hand (docs/pub.md), so this block warns and
# skips when the binary is absent rather than failing the play. The template
# is deployed before the Caddyfile because `caddy validate` provisions the
# file server, which parses the template the Caddyfile points at.
# ---------------------------------------------------------------------------
- name: Check whether Caddy is installed
  ansible.builtin.stat:
    path: /usr/bin/caddy
  register: pub_caddy_bin
  when: pub_caddy_manage_config

- name: Warn when Caddy is not installed
  ansible.builtin.debug:
    msg: >-
      /usr/bin/caddy is missing, so the Caddy config was not deployed. Install
      caddy from the upstream apt repo per docs/pub.md and re-run the play.
  when:
    - pub_caddy_manage_config
    - not pub_caddy_bin.stat.exists

- name: Deploy the directory-listing template
  ansible.builtin.copy:
    src: caddy/browse.html
    dest: /etc/caddy/browse.html
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - pub_caddy_manage_config
    - pub_caddy_bin.stat.exists
  notify: Reload caddy

- name: Deploy the Caddyfile
  ansible.builtin.copy:
    src: caddy/Caddyfile
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/caddy validate --adapter caddyfile --config %s
  become: true
  when:
    - pub_caddy_manage_config
    - pub_caddy_bin.stat.exists
  notify: Reload caddy
