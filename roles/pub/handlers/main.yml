---
- name: Restart brasenia viewport services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    daemon_reload: true
    state: restarted
  loop:
    - brasenia-compositor.service
    - brasenia-focus.service
    - brasenia-pipeline.service
    - brasenia-family-brief.service
    - brasenia-home.service
    - brasenia-fleet.service
    - brasenia-links.service
    - brasenia-grafana.service
  become: true
  when: pub_viewport_enabled

# A changed slot file restarts the grafana producer alone, not the compositor.
- name: Restart brasenia-grafana
  ansible.builtin.systemd_service:
    name: brasenia-grafana.service
    daemon_reload: true
    state: restarted
  become: true
  when: pub_viewport_enabled

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Restart pub-signals
  ansible.builtin.systemd_service:
    name: pub-signals.service
    daemon_reload: true
    state: restarted
  become: true
  when: pub_signals_enabled

# The packaged caddy.service reloads with `caddy reload --force`, so a changed
# browse template is re-read even when the Caddyfile itself did not change.
- name: Reload caddy
  ansible.builtin.systemd_service:
    name: caddy.service
    state: reloaded
  become: true
  when: pub_caddy_manage_config
