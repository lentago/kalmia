---
# ============================================================================
# brasenia — installs the wall display's runtime on LXC 118 for
# lentago/brasenia (named lunaria until the runtime rename, #63, 2026-10-29):
# distro ffmpeg + chromium, the renderer (brasenia-render, #194), the encoder
# and the HLS server the office Roku plays from (#167), and their systemd
# services, and it removes mediamtx, retired with RTMP live ingest (#213), from
# a guest that still has it. Credential-free: it reads
# http://pub.lan/ and the sites in brasenia_allowed_sites. Fresh guest only:
# it does not retire the pre-rename lunaria-* units, so rebuild an old guest
# instead of re-running this on it. See docs/brasenia.md.
# ============================================================================
- name: Install packages (ffmpeg, chromium, PIL, fonts)
  ansible.builtin.apt:
    name:
      - ffmpeg
      - chromium
      - python3-pil
      - fonts-dejavu-core
      - fonts-noto-color-emoji   # emoji in pages rendered as boxes without it (kalmia#194)
      - ca-certificates
    state: present
    update_cache: true
  become: true

- name: Set the container timezone (the stream's clock overlay uses it)
  community.general.timezone:
    name: "{{ brasenia_timezone }}"
  become: true
  notify: Restart brasenia-stream

- name: Create the brasenia service user
  ansible.builtin.user:
    name: "{{ brasenia_user }}"
    system: true
    home: "{{ brasenia_home }}"
    create_home: true
    shell: /usr/sbin/nologin
  become: true

# RTMP live ingest is retired (#213), and mediamtx served nothing else. These
# stop, disable and remove it on a guest built before then; a fresh guest
# skips them. Drop them once LXC 118 has run them or been rebuilt.
- name: Check for the retired mediamtx unit
  ansible.builtin.stat:
    path: /etc/systemd/system/mediamtx.service
  register: brasenia_mediamtx_unit

- name: Stop and disable the retired mediamtx
  ansible.builtin.systemd_service:
    name: mediamtx.service
    state: stopped
    enabled: false
  become: true
  when: brasenia_mediamtx_unit.stat.exists

- name: Remove the retired mediamtx unit and install
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/mediamtx.service
    - /opt/mediamtx
  become: true
  notify: Reload systemd

- name: Deploy the brasenia scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - brasenia-render
    - brasenia-stream
    - brasenia-hls-serve
  become: true
  notify:
    - Restart brasenia-render
    - Restart brasenia-stream
    - Restart brasenia-hls-serve

- name: Render the brasenia environment file
  ansible.builtin.template:
    src: brasenia.env.j2
    dest: /etc/default/brasenia
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Restart brasenia-render
    - Restart brasenia-stream
    - Restart brasenia-hls-serve

- name: Deploy the systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - brasenia-render.service
    - brasenia-stream.service
    - brasenia-hls-serve.service
  become: true
  notify:
    - Restart brasenia-render
    - Restart brasenia-stream
    - Restart brasenia-hls-serve

- name: Enable and start the brasenia services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: started
  loop:
    - brasenia-render.service
    - brasenia-stream.service
    - brasenia-hls-serve.service
  become: true
