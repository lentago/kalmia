---
# ============================================================================
# brasenia — installs the wall display's runtime on LXC 118 for
# lentago/brasenia (named lunaria until the runtime rename, #63, 2026-10-29):
# distro ffmpeg + chromium, the renderer (brasenia-render, #194), the encoder
# and the HLS server the office Roku plays from (#167), a pinned mediamtx (RTMP
# live ingest, #102), and their systemd services. Credential-free: it reads
# http://pub.lan/ and the sites in brasenia_allowed_sites. Fresh guest only:
# it does not retire the pre-rename lunaria-* units, so rebuild an old guest
# instead of re-running this on it. See docs/brasenia.md.
# ============================================================================
- name: Install packages (ffmpeg, chromium, PIL, fonts)
  ansible.builtin.apt:
    name:
      - ffmpeg
      - chromium
      - python3-pil
      - fonts-dejavu-core
      - fonts-noto-color-emoji   # emoji in pages rendered as boxes without it (kalmia#194)
      - ca-certificates
    state: present
    update_cache: true
  become: true

- name: Set the container timezone (the stream's clock overlay uses it)
  community.general.timezone:
    name: "{{ brasenia_timezone }}"
  become: true
  notify: Restart brasenia-stream

- name: Create the brasenia service user
  ansible.builtin.user:
    name: "{{ brasenia_user }}"
    system: true
    home: "{{ brasenia_home }}"
    create_home: true
    shell: /usr/sbin/nologin
  become: true

# mediamtx writes auto-generated certs into its working directory, so the
# install dir is owned by the service user. The version-stamp marker makes
# upgrades idempotent: bump brasenia_mediamtx_version and the unarchive re-runs.
- name: Ensure the mediamtx directory exists
  ansible.builtin.file:
    path: "{{ brasenia_mediamtx_dir }}"
    state: directory
    owner: "{{ brasenia_user }}"
    group: "{{ brasenia_user }}"
    mode: "0755"
  become: true

- name: Download and unpack mediamtx {{ brasenia_mediamtx_version }}
  ansible.builtin.unarchive:
    src: "https://github.com/bluenviron/mediamtx/releases/download/{{ brasenia_mediamtx_version }}/mediamtx_{{ brasenia_mediamtx_version }}_linux_amd64.tar.gz"
    dest: "{{ brasenia_mediamtx_dir }}"
    remote_src: true
    owner: "{{ brasenia_user }}"
    group: "{{ brasenia_user }}"
    creates: "{{ brasenia_mediamtx_dir }}/.installed-{{ brasenia_mediamtx_version }}"
  become: true
  notify: Restart mediamtx

- name: Stamp the installed mediamtx version
  ansible.builtin.file:
    path: "{{ brasenia_mediamtx_dir }}/.installed-{{ brasenia_mediamtx_version }}"
    state: touch
    owner: "{{ brasenia_user }}"
    group: "{{ brasenia_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  become: true

- name: Warn when the RTMP live-ingest credential has not been seeded
  ansible.builtin.debug:
    msg: >-
      BRASENIA_RTMP_PUBLISH_PASS is not set in the environment. This role
      never commits credential material — source it from a host-local env
      file (e.g. ~/.config/kalmia/brasenia-rtmp.env) before running the play;
      see docs/brasenia.md. Until then mediamtx.yml grants no one publish
      access to `live`, so RTMP live-ingest stays disabled (fails closed).
  when: not brasenia_rtmp_publish_pass

- name: Deploy the mediamtx config
  ansible.builtin.template:
    src: mediamtx.yml.j2
    dest: "{{ brasenia_mediamtx_dir }}/mediamtx.yml"
    owner: "{{ brasenia_user }}"
    group: "{{ brasenia_user }}"
    mode: "0644"
  become: true
  notify: Restart mediamtx

- name: Deploy the brasenia scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - brasenia-render
    - brasenia-stream
    - brasenia-hls-serve
  become: true
  notify:
    - Restart brasenia-render
    - Restart brasenia-stream
    - Restart brasenia-hls-serve

- name: Render the brasenia environment file
  ansible.builtin.template:
    src: brasenia.env.j2
    dest: /etc/default/brasenia
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Restart brasenia-render
    - Restart brasenia-stream
    - Restart brasenia-hls-serve

- name: Deploy the systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - mediamtx.service
    - brasenia-render.service
    - brasenia-stream.service
    - brasenia-hls-serve.service
  become: true
  notify:
    - Restart mediamtx
    - Restart brasenia-render
    - Restart brasenia-stream
    - Restart brasenia-hls-serve

- name: Enable and start the brasenia services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: started
  loop:
    - mediamtx.service
    - brasenia-render.service
    - brasenia-stream.service
    - brasenia-hls-serve.service
  become: true
