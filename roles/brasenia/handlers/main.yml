---
- name: Restart mediamtx
  ansible.builtin.systemd_service:
    name: mediamtx.service
    daemon_reload: true
    state: restarted
  become: true

- name: Restart brasenia-render
  ansible.builtin.systemd_service:
    name: brasenia-render.service
    daemon_reload: true
    state: restarted
  become: true

- name: Restart brasenia-stream
  ansible.builtin.systemd_service:
    name: brasenia-stream.service
    daemon_reload: true
    state: restarted
  become: true

- name: Restart brasenia-hls-serve
  ansible.builtin.systemd_service:
    name: brasenia-hls-serve.service
    daemon_reload: true
    state: restarted
  become: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
