---
# ============================================================================
# shell — Starship prompt config + the marker-managed .bashrc block.
# blockinfile owns the markers, so re-runs replace the block cleanly — no
# hand-rolled sed. Legacy blocks from the old setup-*.sh scripts are stripped
# first so a migrated machine doesn't carry two copies.
# ============================================================================
- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config"
    state: directory
    mode: "0755"
  become: false

- name: Render the Starship configuration
  ansible.builtin.template:
    src: starship.toml.j2
    dest: "{{ target_home }}/.config/starship.toml"
    mode: "0644"
  become: false

# The .bashrc block has always sourced this file, but nothing ever created it:
# GITHUB_DEFAULT_OWNER stayed unset, so the ghnew/ghclone aliases guarded on it
# silently did not exist on any provisioned box.
- name: Ensure the workstation config directory exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config/workstation-bootstrap"
    state: directory
    mode: "0755"
  become: false

- name: Render the sourced workstation config
  ansible.builtin.template:
    src: workstation-config.j2
    dest: "{{ target_home }}/.config/workstation-bootstrap/config"
    mode: "0644"
  become: false

- name: Strip legacy bootstrap-script .bashrc blocks (migration)
  ansible.builtin.replace:
    path: "{{ target_home }}/.bashrc"
    regexp: '(?s)\n?# >>> setup-[a-z-]+ >>>.*?# <<< setup-[a-z-]+ <<<\n?'
    replace: ''
  become: false

- name: Install the managed .bashrc block
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED — lentago workstation"
    block: "{{ lookup('ansible.builtin.template', 'bashrc_block.j2') }}"
    create: true
    mode: "0644"
  become: false

# --- CLI helpers ------------------------------------------------------------
# The full set from the workstation-bootstrap predecessor's scripts/, which
# symlinked them into ~/.local/bin via bootstrap/install-scripts.sh. Rendered
# directly here — no symlink farm — and the repos-scanning pair take their
# default directory from the same var the repos role clones into.
# ~/.local/bin already exists and is on PATH (common role, .bashrc block).
# Adding a helper: drop roles/shell/templates/<name>.j2 in and list it here.
- name: Install the CLI helpers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ target_home }}/.local/bin/{{ item }}"
    mode: "0755"
  loop:
    - pull-all
    - clean-all
    - gh-issue
  become: false
