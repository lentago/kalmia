---
# ============================================================================
# minecraft_lan — a Bedrock Dedicated Server on LXC 125 (pve4, #297) that
# Bedrock clients on the LAN join as an added server (Play → Servers). The world
# it serves is announced by the pub.lan worlds page; a sync timer downloads it.
# See docs/minecraft-lan.md.
# ============================================================================
minecraft_lan_user: bedrock
# Server versions, the live server.properties, the worlds and the sync state.
minecraft_lan_home: /opt/bedrock

# Staged on the NAS (read-only mount): the server can't be downloaded by
# script. Keep in step with minecraft_runner_bds_version/_sha256: clients only
# join a server of their own version, and the tablets update themselves.
minecraft_lan_staging: /srv/minecraft-ci
minecraft_lan_bds_version: "1.26.63.1"
minecraft_lan_bds_sha256: b40b04c8f5a7c42a19ee685c22fc593e66116b9c22741b8c75489306b252ff62

# The announcement: JSON naming one .mcworld (next to it), its SHA-256, a slug
# and the title shown in the LAN list.
minecraft_lan_announce_url: http://pub.lan/minecraft/lan.json
minecraft_lan_sync_interval: 1min

# Lines this role owns in server.properties. level-name and server-name belong
# to the sync script, which sets them from the announcement.
minecraft_lan_properties:
  gamemode: creative
  force-gamemode: "false"
  difficulty: peaceful
  allow-cheats: "true"
  max-players: "8"
  # Xbox Live sign-in, as on Realms (needs the WAN).
  online-mode: "true"
  # The stock file turns the allowlist on, which would refuse every player not
  # listed in allowlist.json. Who may join is decided by who can reach it.
  allow-list: "false"
  # NetherNet, the 1.26 default and the only transport 1.26 clients use: with
  # RakNet the server logs "NetherNet is the only supported transport type.
  # Players will not be able to connect", and clients no longer list it under
  # LAN Games (#300 tried RakNet; #299 tracks the join failure).
  transport: nethernet
  # Answer LAN discovery (NetherNet, UDP 7551): it appears under LAN Games,
  # though 1.26.62 clients can only join it as an added server (#299).
  enable-lan-visibility: "true"
  server-port: "19132"
  server-portv6: "19133"
  # A deliberate trust decision: every player who can reach the server (any
  # device on the main LAN, 192.168.139.0/24, signed in to Xbox Live; nothing
  # is port-forwarded) becomes an operator and can use commands such as time,
  # weather and tp without per-player setup. Set "member" if the LAN ever
  # carries devices whose players shouldn't have that.
  default-player-permission-level: operator
  content-log-console-output-enabled: "true"
  # Send real chunks out to each client's render distance. With client-side
  # generation on, clients draw far-off chunks themselves from the seed, which
  # in a flat world is plain grass: a castle 200 blocks out stayed invisible
  # until the player was close (#305).
  client-side-chunk-generation-enabled: "false"

# The share is CIFS forced to uid/gid 101000 (container 1000), mode 0770;
# same group as the other guests that read it.
minecraft_lan_group: webdrop
minecraft_lan_group_gid: 1000
