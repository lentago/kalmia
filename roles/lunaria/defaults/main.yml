---
# ============================================================================
# lunaria — wall-display compositor for the LXC 118 (pve4), serving the
# product now named lentago/brasenia (renamed from lentago/lunaria on
# 2026-07-20; 'lunaria' is the legacy runtime name, rename tracked in #63).
# Renders the Morning Brief TV edition from pub.lan into a continuous H.264
# HLS stream the play-room Roku dev channel plays. Concept: docs/lunaria.md
# and http://pub.lan/brasenia/concept.md. Deliberately credential-free — pub
# owns the Google Drive leg; lunaria only reads http://pub.lan/.
# ============================================================================
lunaria_user: lunaria
lunaria_home: /var/lib/lunaria

# The clock overlay burned into the stream uses the system TZ; the debian
# template defaults to UTC, which reads as a broken clock on the TV.
lunaria_timezone: America/New_York

lunaria_mediamtx_version: v1.19.2
lunaria_mediamtx_dir: /opt/mediamtx

# Frame sources: the TV edition is preferred (exact 1280x720 screens); the
# full brief is the fallback, sliced into 720px pages.
lunaria_tv_url: http://pub.lan/brief/tv.html
lunaria_full_url: http://pub.lan/brief/

# Seconds each screen stays up before rotating to the next.
lunaria_page_dwell: 12
# Seconds between re-renders of the source page.
lunaria_regen_interval: 600

# Additional TV-contract pane pages (1280px wide, height an exact multiple of
# 720 — the brasenia pane contract) appended to the rotation after the brief.
# A Phase-1.5 precursor of the brasenia pane bus: each URL is shot like a TV
# edition and its 720px screens join the frame rotation; an unreachable or
# failing extra pane is skipped without touching the brief pages.
lunaria_extra_urls:
  - http://pub.lan/praxis/graph/tv.html

# --- Cast receiver watchdog (brasenia ADR-0006, kalmia#99) -------------------
# The Chromecast is a *second* client alongside the Roku/HLS path — adding it
# must not touch the Roku client (ADR-0006 acceptance test). This watchdog is
# the Cast path's analogue of the mandatory Roku retry handler (ADR-0002): a
# systemd timer that re-launches the registered custom web receiver on the
# household Chromecast after power blips, Chromecast OS updates, ambient-mode
# reclaims, or input changes.
lunaria_cast_watchdog_enabled: true

# Registered 2026-08-14 (Cast Developer Console, unpublished Custom Receiver;
# receiver URL http://pub.lan/cast/). Both values are deliberately COMMITTED:
# neither is a secret — the App ID is public in brasenia's
# cast-app/app-config.json and only launches on the dev-registered household
# device, and the friendly name is broadcast in cleartext mDNS to every LAN
# device. Committing them keeps rebuild-from-scratch real: an `-e`-only value
# would silently revert the env file to a dormant placeholder on any future
# provisioning run.
lunaria_cast_app_id: "83A58DDE"
lunaria_cast_device_name: "Family Room TV"

# How often the watchdog re-checks the receiver (a systemd time span).
lunaria_cast_watchdog_interval: 60s

# --- RTMP live-ingest (kalmia#102) -------------------------------------------
# Generic RTMP publish path for LAN producers (first client: DJI Fly's
# custom-RTMP live streaming; H.264/AAC remux only, no transcode). The path
# name is protocol-shaped, not producer-shaped — adding a second producer
# (OBS, Larix, ...) must require no mediamtx.yml changes.
lunaria_rtmp_publish_user: live

# Publish credential for the `live` path, sourced from the environment —
# never committed, same pattern as roles/repos' GH_TOKEN. Locally, source it
# from a host-local env file before running the play (e.g.
# ~/.config/kalmia/lunaria-rtmp.env, alongside the existing
# ~/.config/kalmia/proxmox.env precedent); see docs/lunaria.md. Empty by
# default: with no credential, mediamtx.yml.j2 omits the live-publisher auth
# entry entirely, so RTMP publish to `live` fails closed (401) rather than
# falling open.
lunaria_rtmp_publish_pass: "{{ lookup('env', 'LUNARIA_RTMP_PUBLISH_PASS') | default('', true) }}"
