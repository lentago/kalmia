---
# ============================================================================
# lunaria — installs the wall-display compositor stack for lentago/brasenia
# (renamed from lentago/lunaria on 2026-07-20; 'lunaria' is the legacy
# runtime name, rename tracked in #63): distro ffmpeg + chromium (headless
# shots), the shooter/rotator/encoder scripts and the HLS server the office
# Roku plays from (#167), a pinned mediamtx (RTMP live ingest, #102), and
# their systemd services. Runs credential-free: the only input is
# http://pub.lan/. See docs/lunaria.md.
# ============================================================================
- name: Install packages (ffmpeg, chromium, PIL, fonts)
  ansible.builtin.apt:
    name:
      - ffmpeg
      - chromium
      - python3-pil
      - fonts-dejavu-core
      - ca-certificates
    state: present
    update_cache: true
  become: true

- name: Set the container timezone (the stream's clock overlay uses it)
  community.general.timezone:
    name: "{{ lunaria_timezone }}"
  become: true
  notify: Restart lunaria-stream

- name: Create the lunaria service user
  ansible.builtin.user:
    name: "{{ lunaria_user }}"
    system: true
    home: "{{ lunaria_home }}"
    create_home: true
    shell: /usr/sbin/nologin
  become: true

- name: Ensure the pages directory exists
  ansible.builtin.file:
    path: "{{ lunaria_home }}/pages"
    state: directory
    owner: "{{ lunaria_user }}"
    group: "{{ lunaria_user }}"
    mode: "0755"
  become: true

# mediamtx writes auto-generated certs into its working directory, so the
# install dir is owned by the service user. The version-stamp marker makes
# upgrades idempotent: bump lunaria_mediamtx_version and the unarchive re-runs.
- name: Ensure the mediamtx directory exists
  ansible.builtin.file:
    path: "{{ lunaria_mediamtx_dir }}"
    state: directory
    owner: "{{ lunaria_user }}"
    group: "{{ lunaria_user }}"
    mode: "0755"
  become: true

- name: Download and unpack mediamtx {{ lunaria_mediamtx_version }}
  ansible.builtin.unarchive:
    src: "https://github.com/bluenviron/mediamtx/releases/download/{{ lunaria_mediamtx_version }}/mediamtx_{{ lunaria_mediamtx_version }}_linux_amd64.tar.gz"
    dest: "{{ lunaria_mediamtx_dir }}"
    remote_src: true
    owner: "{{ lunaria_user }}"
    group: "{{ lunaria_user }}"
    creates: "{{ lunaria_mediamtx_dir }}/.installed-{{ lunaria_mediamtx_version }}"
  become: true
  notify: Restart mediamtx

- name: Stamp the installed mediamtx version
  ansible.builtin.file:
    path: "{{ lunaria_mediamtx_dir }}/.installed-{{ lunaria_mediamtx_version }}"
    state: touch
    owner: "{{ lunaria_user }}"
    group: "{{ lunaria_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  become: true

- name: Warn when the RTMP live-ingest credential has not been seeded
  ansible.builtin.debug:
    msg: >-
      LUNARIA_RTMP_PUBLISH_PASS is not set in the environment. This role
      never commits credential material — source it from a host-local env
      file (e.g. ~/.config/kalmia/lunaria-rtmp.env) before running the play;
      see docs/lunaria.md. Until then mediamtx.yml grants no one publish
      access to `live`, so RTMP live-ingest stays disabled (fails closed).
  when: not lunaria_rtmp_publish_pass

- name: Deploy the mediamtx config
  ansible.builtin.template:
    src: mediamtx.yml.j2
    dest: "{{ lunaria_mediamtx_dir }}/mediamtx.yml"
    owner: "{{ lunaria_user }}"
    group: "{{ lunaria_user }}"
    mode: "0644"
  become: true
  notify: Restart mediamtx

- name: Deploy the lunaria scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - lunaria-shooter
    - lunaria-pointer
    - lunaria-frames
    - lunaria-stream
    - lunaria-hls-serve
  become: true
  notify:
    - Restart lunaria-frames
    - Restart lunaria-stream
    - Restart lunaria-hls-serve

- name: Render the lunaria environment file
  ansible.builtin.template:
    src: lunaria.env.j2
    dest: /etc/default/lunaria
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Restart lunaria-frames
    - Restart lunaria-stream
    - Restart lunaria-hls-serve

- name: Deploy the systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - mediamtx.service
    - lunaria-frames.service
    - lunaria-stream.service
    - lunaria-hls-serve.service
  become: true
  notify:
    - Restart mediamtx
    - Restart lunaria-frames
    - Restart lunaria-stream
    - Restart lunaria-hls-serve

- name: Enable and start the lunaria services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: started
  loop:
    - mediamtx.service
    - lunaria-frames.service
    - lunaria-stream.service
    - lunaria-hls-serve.service
  become: true

# ---------------------------------------------------------------------------
# Retired Cast receiver watchdog (brasenia ADR-0010, 2026-10-28). The
# Chromecast client is gone and Roku is the client platform, so this block
# makes sure the watchdog the role used to install (kalmia#99) is absent:
# timer stopped and disabled, units, script and env file removed, and its
# only dependency uninstalled. Idempotent; a host built after the retirement
# has nothing to remove.
# ---------------------------------------------------------------------------
- name: Check for the retired Cast watchdog timer
  ansible.builtin.stat:
    path: /etc/systemd/system/lunaria-cast-watchdog.timer
  register: lunaria_cast_timer

- name: Stop and disable the retired Cast watchdog
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - lunaria-cast-watchdog.timer
    - lunaria-cast-watchdog.service
  become: true
  when: lunaria_cast_timer.stat.exists

- name: Remove the retired Cast watchdog's units, script and env file
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/lunaria-cast-watchdog.timer
    - /etc/systemd/system/lunaria-cast-watchdog.service
    - /usr/local/bin/lunaria-cast-watchdog
    - /etc/default/lunaria-cast
  become: true
  notify: Reload systemd

- name: Remove pychromecast (only the retired Cast watchdog used it)
  ansible.builtin.apt:
    name: python3-pychromecast
    state: absent
  become: true
