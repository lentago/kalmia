---
# ============================================================================
# cli_tools — jq, yq, bat, fd, ripgrep, tmux, shellcheck, direnv, pipx, tree,
# fzf, tldr, and the Starship prompt binary.
# ============================================================================
- name: Install quality-of-life packages from the system package manager
  ansible.builtin.package:
    name: "{{ qol_packages + [pkg_bat, pkg_fd, pkg_ripgrep, pkg_shellcheck, pkg_pipx] }}"
    state: present
  become: true

- name: Install tldr (pip, user scope)
  ansible.builtin.pip:
    name: tldr
    extra_args: --user --break-system-packages
  become: false
  failed_when: false        # best-effort; pip policies vary by distro

# --- yq (single binary) ----------------------------------------------------
- name: Check for yq
  ansible.builtin.stat:
    path: /usr/local/bin/yq
  register: yq_bin

- name: Install yq {{ yq_version }}
  ansible.builtin.get_url:
    url: "https://github.com/mikefarah/yq/releases/download/{{ yq_version }}/yq_linux_amd64"
    dest: /usr/local/bin/yq
    checksum: "sha256:{{ yq_sha256 }}"
    mode: "0755"
  become: true
  when: not yq_bin.stat.exists

# --- fzf (git clone + installer, user space) -------------------------------
- name: Clone fzf
  ansible.builtin.git:
    repo: https://github.com/junegunn/fzf.git
    dest: "{{ target_home }}/.fzf"
    depth: 1
    version: master
  become: false

# Generate ~/.fzf.bash (PATH + key-bindings + completion) but don't touch
# .bashrc — the shell role owns that, and the block sources ~/.fzf.bash.
# (`--no-bash` would skip generating that file, breaking both the `creates:`
# idempotency guard and the shell integration.)
- name: Run the fzf installer
  ansible.builtin.command: >-
    {{ target_home }}/.fzf/install --key-bindings --completion
    --no-update-rc --no-zsh --no-fish
  args:
    creates: "{{ target_home }}/.fzf.bash"
  become: false

# --- Starship prompt (single binary → /usr/local/bin) ----------------------
# The pinned release tarball, checked against its sha256, replaces the
# `curl starship.rs/install.sh | sh` installer (kalmia#259).
- name: Check for Starship
  ansible.builtin.stat:
    path: /usr/local/bin/starship
  register: starship_bin

- name: Install the Starship prompt {{ starship_version }}
  when: not starship_bin.stat.exists
  become: true
  block:
    - name: Download the Starship release
      ansible.builtin.get_url:
        url: "https://github.com/starship/starship/releases/download/{{ starship_version }}/starship-x86_64-unknown-linux-musl.tar.gz"
        dest: "/tmp/starship-{{ starship_version }}.tar.gz"
        checksum: "sha256:{{ starship_sha256 }}"
        mode: "0644"

    - name: Unpack Starship into /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/starship-{{ starship_version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include:
          - starship
        mode: "0755"
