---
# dev_host — extras for the single dev host that runs the Director and EMs
# (xubuntu-ws, #286). Gated by `dev_host` in group_vars/all.yml.
dev_host_nas_share: "//192.168.139.6/lentago"
dev_host_nas_mountpoint: /mnt/lentago
# Hand-placed, never in git: the cifs username/password. The fstab line points
# at it; the mount fails closed (nofail) until it exists.
dev_host_nas_credentials: "{{ target_home }}/.smbcred"
dev_host_nas_options:
  - "credentials={{ dev_host_nas_credentials }}"
  - "uid={{ ansible_user_uid }}"
  - "gid={{ ansible_user_gid }}"
  - iocharset=utf8
  - file_mode=0664
  - dir_mode=0775
  - vers=3.0
  - _netdev
  - nofail
  - x-systemd.automount

# --- Nightly mirror of the Claude state (#286) -------------------------------
# xubuntu-ws is the single source of Claude memory and transcripts; VM 102 is
# otherwise only in the weekly vzdump. Never under web/: pub.lan serves that to
# the whole LAN, and transcripts hold message text.
dev_host_claude_backup_dest: "{{ dev_host_nas_mountpoint }}/claude-state/{{ ansible_hostname }}"
dev_host_claude_backup_calendar: "*-*-* 02:30:00"

# --- Admin parity with the old ThinkPad (#337) --------------------------------
# sha256 of https://downloads.1password.com/linux/keys/1password.asc (computed
# 2026-11-19; 1Password publishes none). Bump if the key rotates.
dev_host_op_gpg_key_sha256: "f39e7dd9dedc581ced85732832f217e0de5860a3b80279b5af4bc7c6d8157bae"
# The osmunda k3s server (LXC 119, k3s-1 on pve5). The kubeconfig is fetched from
# it, never copied from another workstation.
dev_host_kube_pve_node: pve5
dev_host_kube_ctid: 119
dev_host_kube_server: "https://192.168.139.25:6443"
