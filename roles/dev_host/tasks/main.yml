---
# ============================================================================
# dev_host — what the single dev host needs beyond the workstation baseline:
# the NAS mount, the `pane` wall-display command, cluster SSH aliases and uv
# (kalmia#286). Runs after cli_tools (pipx) and repos (the brasenia clone).
# ============================================================================

# --- NAS share --------------------------------------------------------------
- name: Install cifs-utils
  ansible.builtin.package:
    name: cifs-utils
    state: present
  become: true

- name: Create the NAS mount point
  ansible.builtin.file:
    path: "{{ dev_host_nas_mountpoint }}"
    state: directory
    mode: "0755"
  become: true

# The credentials file holds a password, so it stays hand-managed. Mounting is
# lazy (x-systemd.automount) and nofail, so a missing file never fails boot.
- name: Declare the NAS share in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^{{ dev_host_nas_share | regex_escape }}\s+{{ dev_host_nas_mountpoint | regex_escape }}\s'
    line: "{{ dev_host_nas_share }} {{ dev_host_nas_mountpoint }} cifs {{ dev_host_nas_options | join(',') }} 0 0"
  become: true
  register: dev_host_fstab

- name: Reload systemd so the new automount unit exists
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: dev_host_fstab is changed

# --- pane (brasenia viewport bus) -------------------------------------------
# Needs the brasenia clone, so it follows the repos role and clone_repos.
- name: Link pane into ~/.local/bin
  ansible.builtin.file:
    src: "{{ repos_dir }}/lentago/brasenia/bin/pane"
    dest: "{{ target_home }}/.local/bin/pane"
    state: link
    force: false
  become: false
  when: clone_repos | bool

# --- SSH aliases ------------------------------------------------------------
- name: Ensure ~/.ssh and ~/.ssh/config.d exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ target_home }}/.ssh"
    - "{{ target_home }}/.ssh/config.d"
  become: false

- name: Render the managed host aliases
  ansible.builtin.template:
    src: ssh-hosts.conf.j2
    dest: "{{ target_home }}/.ssh/config.d/kalmia.conf"
    mode: "0600"
  become: false

# `Include` must precede any Host stanza. Everything else in ~/.ssh/config stays
# the user's. A hand-made copy of an alias left there is harmless (the managed,
# identical one wins) and can be deleted by hand.
- name: Include the managed aliases from ~/.ssh/config
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.ssh/config"
    line: "Include ~/.ssh/config.d/*.conf"
    insertbefore: BOF
    create: true
    mode: "0600"
  become: false

# --- uv ---------------------------------------------------------------------
# The aws and grafana MCP servers launch through uvx.
- name: Install uv (and uvx) with pipx
  community.general.pipx:
    name: uv
    state: present
  become: false

# --- Nightly Claude-state mirror to the NAS ---------------------------------
- name: Install the Claude-state backup script
  ansible.builtin.template:
    src: claude-state-backup.sh.j2
    dest: "{{ target_home }}/.local/bin/claude-state-backup"
    mode: "0755"
  become: false

- name: Install the Claude-state backup units
  ansible.builtin.template:
    src: "claude-state-backup.{{ item }}.j2"
    dest: "/etc/systemd/system/claude-state-backup.{{ item }}"
    mode: "0644"
  loop: [service, timer]
  become: true
  register: dev_host_backup_units

- name: Enable the nightly mirror timer
  ansible.builtin.systemd_service:
    name: claude-state-backup.timer
    enabled: true
    state: started
    daemon_reload: "{{ dev_host_backup_units is changed }}"
  become: true

# --- rclone and the Bitwarden CLI (#337, #341) -----------------------------
# Sign-ins are the maintainer's, per machine: `rclone config` (Drive OAuth),
# `bw login` once and `bw unlock` per shell. Nothing is copied from another
# host, and no master password or BW_SESSION is stored anywhere.
- name: Install rclone
  ansible.builtin.package:
    name: rclone
    state: present
  become: true

# bw comes from Bitwarden's own release assets (bitwarden/clients, cli-v<ver>):
# one self-contained binary, so no Node toolchain, and the version is pinned by
# checksum. The snap would auto-update past any pin, and the npm package would
# pull in nvm's Node.
- name: Download the Bitwarden CLI
  ansible.builtin.get_url:
    url: "https://github.com/bitwarden/clients/releases/download/cli-v{{ dev_host_bw_version }}/bw-linux-{{ dev_host_bw_version }}.zip"
    dest: "/tmp/bw-linux-{{ dev_host_bw_version }}.zip"
    checksum: "sha256:{{ dev_host_bw_sha256 }}"
    mode: "0644"
  when: ansible_architecture == "x86_64"

- name: Create the versioned Bitwarden CLI directory
  ansible.builtin.file:
    path: "/opt/bitwarden-cli/{{ dev_host_bw_version }}"
    state: directory
    mode: "0755"
  become: true

- name: Unpack the Bitwarden CLI into a versioned directory
  ansible.builtin.unarchive:
    src: "/tmp/bw-linux-{{ dev_host_bw_version }}.zip"
    dest: "/opt/bitwarden-cli/{{ dev_host_bw_version }}"
    remote_src: true
    creates: "/opt/bitwarden-cli/{{ dev_host_bw_version }}/bw"
    mode: "0755"
  become: true
  when: ansible_architecture == "x86_64" and not ansible_check_mode

# The pinned binary is linked at a fixed path; /usr/local/bin/bw is a wrapper
# that adds the per-task session key (below).
- name: Link the real bw at a fixed path
  ansible.builtin.file:
    src: "/opt/bitwarden-cli/{{ dev_host_bw_version }}/bw"
    dest: /opt/bitwarden-cli/bw
    state: link
  become: true
  when: ansible_architecture == "x86_64" and not ansible_check_mode

# --- Bitwarden Secrets Manager CLI (#343) ------------------------------------
# bws is path A: a machine account scoped to one project, its token in
# ~/.config/bws/access-token (the shell role exports it when the file is
# non-empty). Ansible creates the directory and never the token.
- name: Download the Bitwarden Secrets Manager CLI
  ansible.builtin.get_url:
    url: "https://github.com/bitwarden/sdk-sm/releases/download/bws-v{{ dev_host_bws_version }}/bws-x86_64-unknown-linux-gnu-{{ dev_host_bws_version }}.zip"
    dest: "/tmp/bws-linux-{{ dev_host_bws_version }}.zip"
    checksum: "sha256:{{ dev_host_bws_sha256 }}"
    mode: "0644"
  when: ansible_architecture == "x86_64"

- name: Create the versioned Secrets Manager CLI directory
  ansible.builtin.file:
    path: "/opt/bitwarden-cli/bws-{{ dev_host_bws_version }}"
    state: directory
    mode: "0755"
  become: true

- name: Unpack the Secrets Manager CLI into a versioned directory
  ansible.builtin.unarchive:
    src: "/tmp/bws-linux-{{ dev_host_bws_version }}.zip"
    dest: "/opt/bitwarden-cli/bws-{{ dev_host_bws_version }}"
    remote_src: true
    creates: "/opt/bitwarden-cli/bws-{{ dev_host_bws_version }}/bws"
    mode: "0755"
  become: true
  when: ansible_architecture == "x86_64" and not ansible_check_mode

- name: Link bws into /usr/local/bin
  ansible.builtin.file:
    src: "/opt/bitwarden-cli/bws-{{ dev_host_bws_version }}/bws"
    dest: /usr/local/bin/bws
    state: link
  become: true
  when: ansible_architecture == "x86_64" and not ansible_check_mode

- name: Create the bws config directory
  ansible.builtin.file:
    path: "{{ target_home }}/.config/bws"
    state: directory
    mode: "0700"

# --- Per-task bw unlock (#343) -----------------------------------------------
# bw-unlock keeps the session key on tmpfs; the bw wrapper reads it at call
# time, because Claude Code snapshots the shell environment at session start.
- name: Check whether /usr/local/bin/bw is still the symlink to the binary
  ansible.builtin.stat:
    path: /usr/local/bin/bw
    follow: false
  register: dev_host_bw_path

# Writing the wrapper through the symlink would overwrite the pinned binary.
- name: Drop the old bw symlink
  ansible.builtin.file:
    path: /usr/local/bin/bw
    state: absent
  become: true
  when: dev_host_bw_path.stat.islnk | default(false)

- name: Create the shared helper directory
  ansible.builtin.file:
    path: /usr/local/lib/kalmia
    state: directory
    mode: "0755"
  become: true

- name: Install the bw session helpers
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  become: true
  loop:
    - { src: bw-session.sh, dest: /usr/local/lib/kalmia/bw-session.sh, mode: "0644" }
    - { src: bw, dest: /usr/local/bin/bw, mode: "0755" }
    - { src: bw-unlock, dest: /usr/local/bin/bw-unlock, mode: "0755" }
    - { src: bw-lock, dest: /usr/local/bin/bw-lock, mode: "0755" }

# #339 briefly installed the 1Password CLI; Chris moved to Bitwarden (#341).
- name: Remove the 1Password CLI
  ansible.builtin.apt:
    name: 1password-cli
    state: absent
  become: true
  when: ansible_os_family == "Debian"

- name: Remove the 1Password apt repository
  ansible.builtin.deb822_repository:
    name: 1password
    state: absent
  become: true
  when: ansible_os_family == "Debian"

- name: Remove the 1Password GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings/1password.asc
    state: absent
  become: true

# --- kubeconfig for the osmunda k3s cluster ---------------------------------
# Fetched from the k3s server over the same root SSH path as the rest of the
# cluster work, and only when ~/.kube/config does not exist, so a hand-merged
# config is never overwritten. Best effort: an unreachable server skips it.
- name: Check for an existing kubeconfig
  ansible.builtin.stat:
    path: "{{ target_home }}/.kube/config"
  register: dev_host_kubeconfig

- name: Fetch the k3s kubeconfig from the server
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=10
      - pve
      - "ssh {{ dev_host_kube_pve_node }} pct exec {{ dev_host_kube_ctid }} -- cat /etc/rancher/k3s/k3s.yaml"
  register: dev_host_k3s_yaml
  changed_when: false
  failed_when: false
  no_log: true          # stdout is the cluster-admin client key
  when: not dev_host_kubeconfig.stat.exists

- name: Write ~/.kube/config
  when:
    - not dev_host_kubeconfig.stat.exists
    - dev_host_k3s_yaml.rc | default(1) == 0
    - "'apiVersion' in dev_host_k3s_yaml.stdout"
  block:
    - name: Ensure ~/.kube exists
      ansible.builtin.file:
        path: "{{ target_home }}/.kube"
        state: directory
        mode: "0700"

    - name: Write the kubeconfig, pointed at the server's LAN address
      ansible.builtin.copy:
        dest: "{{ target_home }}/.kube/config"
        content: "{{ dev_host_k3s_yaml.stdout | replace('https://127.0.0.1:6443', dev_host_kube_server) }}\n"
        mode: "0600"
      no_log: true
