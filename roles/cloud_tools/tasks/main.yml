---
# ============================================================================
# cloud_tools — AWS CLI v2, Granted, Terraform (tfswitch), kubectl, eksctl, Helm.
# Binaries land in /usr/local/bin (system) or ~/bin (tfswitch's default).
# ============================================================================

# --- AWS CLI v2 ------------------------------------------------------------
- name: Check for AWS CLI v2
  ansible.builtin.command: aws --version
  register: aws_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install AWS CLI v2
  when: "'aws-cli/2' not in (aws_check.stdout | default('')) and 'aws-cli/2' not in (aws_check.stderr | default(''))"
  become: true
  block:
    - name: Download the AWS CLI v2 installer {{ awscli_version }}
      ansible.builtin.get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-{{ awscli_version }}.zip"
        dest: /tmp/awscliv2.zip
        checksum: "sha256:{{ awscli_sha256 }}"
        mode: "0644"

    - name: Download the AWS CLI v2 installer signature
      ansible.builtin.get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-{{ awscli_version }}.zip.sig"
        dest: /tmp/awscliv2.zip.sig
        checksum: "sha256:{{ awscli_sig_sha256 }}"
        mode: "0644"

    - name: Stage the AWS CLI Team public key
      ansible.builtin.copy:
        src: aws-cli-team.asc
        dest: /tmp/aws-cli-team.asc
        mode: "0644"

    # A throwaway GNUPGHOME keeps the user's keyring out of it. VALIDSIG is
    # printed only for a good signature, and its last field is the signing
    # key's primary fingerprint, which must be the pinned one. A revoked key
    # fails even though the signature is good.
    - name: Verify the AWS CLI v2 installer against the AWS CLI Team key
      ansible.builtin.shell: |
        set -euo pipefail
        GNUPGHOME="$(mktemp -d)"
        export GNUPGHOME
        trap 'rm -rf "$GNUPGHOME"' EXIT
        gpg --batch --quiet --import /tmp/aws-cli-team.asc
        status="$(gpg --batch --status-fd 1 --verify /tmp/awscliv2.zip.sig /tmp/awscliv2.zip 2>/dev/null)"
        if grep -q '^\[GNUPG:\] REVKEYSIG ' <<<"$status"; then
          echo "AWS CLI Team key is revoked" >&2; exit 1
        fi
        grep -Eq '^\[GNUPG:\] VALIDSIG .* {{ awscli_pgp_fingerprint }}$' <<<"$status"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Unpack the AWS CLI v2 installer
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true

    - name: Run the AWS CLI v2 installer
      ansible.builtin.command: /tmp/aws/install --update
      args:
        creates: /usr/local/bin/aws

# --- Granted (assume) ------------------------------------------------------
# Granted moved from common-fate to fwdcloudsec after Common Fate wound down;
# its old APT repo/CDN are dead, so install straight from GitHub releases.
- name: Check for Granted
  ansible.builtin.stat:
    path: /usr/local/bin/granted
  register: granted_bin

- name: Install Granted {{ granted_version }}
  when: not granted_bin.stat.exists
  become: true
  block:
    - name: Download the Granted release
      ansible.builtin.get_url:
        url: "https://github.com/fwdcloudsec/granted/releases/download/v{{ granted_version }}/granted_{{ granted_version }}_linux_x86_64.tar.gz"
        dest: "/tmp/granted_{{ granted_version }}_linux_x86_64.tar.gz"
        checksum: "sha256:{{ granted_sha256 }}"
        mode: "0644"

    - name: Unpack Granted into /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/granted_{{ granted_version }}_linux_x86_64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include:
          - granted
          - assume
        mode: "0755"

# --- Terraform via tfswitch ------------------------------------------------
- name: Check for tfswitch
  ansible.builtin.stat:
    path: /usr/local/bin/tfswitch
  register: tfswitch_bin

# The pinned release tarball, checked against its sha256, replaces the
# `curl …/install.sh | bash` installer (kalmia#259).
- name: Install tfswitch {{ tfswitch_version }}
  when: not tfswitch_bin.stat.exists
  become: true
  block:
    - name: Download the tfswitch release
      ansible.builtin.get_url:
        url: >-
          https://github.com/warrensbox/terraform-switcher/releases/download/{{ tfswitch_version
          }}/terraform-switcher_{{ tfswitch_version }}_linux_amd64.tar.gz
        dest: "/tmp/terraform-switcher_{{ tfswitch_version }}_linux_amd64.tar.gz"
        checksum: "sha256:{{ tfswitch_sha256 }}"
        mode: "0644"

    - name: Unpack tfswitch into /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/terraform-switcher_{{ tfswitch_version }}_linux_amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include:
          - tfswitch
        mode: "0755"

- name: Install the latest Terraform via tfswitch
  ansible.builtin.command: tfswitch --latest
  args:
    creates: "{{ target_home }}/bin/terraform"
  become: false
  failed_when: false

# --- kubectl ---------------------------------------------------------------
# Pinned, not `stable.txt` (kalmia#259). With a checksum, get_url converges an
# existing /usr/local/bin/kubectl to the pin and leaves a matching one alone.
- name: Install kubectl {{ kubectl_version }}
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    checksum: "sha256:{{ kubectl_sha256 }}"
    mode: "0755"
  become: true

# --- eksctl ----------------------------------------------------------------
- name: Check for eksctl
  ansible.builtin.stat:
    path: /usr/local/bin/eksctl
  register: eksctl_bin

- name: Install eksctl {{ eksctl_version }}
  when: not eksctl_bin.stat.exists
  become: true
  block:
    - name: Download the eksctl release
      ansible.builtin.get_url:
        url: "https://github.com/eksctl-io/eksctl/releases/download/{{ eksctl_version }}/eksctl_Linux_amd64.tar.gz"
        dest: "/tmp/eksctl_{{ eksctl_version }}_Linux_amd64.tar.gz"
        checksum: "sha256:{{ eksctl_sha256 }}"
        mode: "0644"

    - name: Unpack eksctl into /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/eksctl_{{ eksctl_version }}_Linux_amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include:
          - eksctl
        mode: "0755"

# --- Helm ------------------------------------------------------------------
- name: Check for Helm
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_bin

# The pinned release tarball, checked against its sha256, replaces the
# `curl …/get-helm-3 | bash` installer (kalmia#259). The binary sits under
# linux-amd64/ in the tarball, so it unpacks to a scratch dir and is copied out.
- name: Install Helm {{ helm_version }}
  when: not helm_bin.stat.exists
  become: true
  block:
    - name: Download the Helm release
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
        checksum: "sha256:{{ helm_sha256 }}"
        mode: "0644"

    - name: Create the Helm unpack directory
      ansible.builtin.file:
        path: "/tmp/helm-{{ helm_version }}"
        state: directory
        mode: "0755"

    - name: Unpack the Helm release
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}"
        remote_src: true

    - name: Install the helm binary into /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/helm-{{ helm_version }}/linux-amd64/helm"
        dest: /usr/local/bin/helm
        remote_src: true
        mode: "0755"
