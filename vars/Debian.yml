---
# ============================================================================
# Debian / Ubuntu (apt) package-name map. Loaded when ansible_os_family ==
# "Debian" (covers the crostini, xubuntu, and ubuntu_laptop profiles).
# ============================================================================
deb_arch: amd64

base_packages:
  - build-essential
  - curl
  - wget
  - git
  - unzip
  - zip
  - gnupg
  - lsb-release
  - ca-certificates
  - openssl              # Helm's installer needs it; present by default on
                         # Debian/Ubuntu but pinned here for parity with Fedora
  - apt-transport-https
  - python3-debian        # required by the deb822_repository module
                          # (software-properties-common is deliberately absent:
                          # gone from Debian 13 main, and the repo adds apt
                          # sources via deb822_repository, not add-apt-repository)
  - man-db
  - less
  - openssh-client
  - bind9-dnsutils        # `dnsutils` was a transitional package, dropped in
                          # Debian 13; bind9-dnsutils is the real name on both
                          # Debian and Ubuntu
  - net-tools
  - traceroute
  - nmap
  - whois
  - htop
  - ncdu
  - nano
  - nfs-common

python_packages:
  - python3
  - python3-pip
  - python3-venv
  - python3-full

# CLI tools whose package name differs from the binary name on Debian.
pkg_bat: bat
pkg_fd: fd-find
pkg_ripgrep: ripgrep
pkg_shellcheck: shellcheck
pkg_pipx: pipx
bat_command: batcat        # Debian ships bat as `batcat`
fd_command: fdfind         # Debian ships fd as `fdfind`

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin

tlp_packages:
  - tlp
  - tlp-rdw

fwupd_package: fwupd
