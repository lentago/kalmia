---
# ============================================================================
# Provision a minecraft-runner LXC (124 or 126 on pve4, 127 on pve3) — the self-hosted Actions
# runners for cpitzi/minecraft-builds (#293, #318, #320). Self-provisioning, same as
# pe-publish.yml: run this ON the container. It registers under the guest's
# hostname.
#
#   MINECRAFT_RUNNER_TOKEN=<token> ansible-playbook -i inventory/hosts.yml minecraft-runner.yml
#
# The token is needed only for the first registration. Each guest and its NAS
# bind mounts are created by terraform/minecraft-runner.tf (CI apply-on-merge,
# mounts via the pve_host mount hook). See docs/minecraft-runner.md.
# ============================================================================
- name: Provision the minecraft-builds CI runner
  hosts: all
  gather_facts: true
  become: false

  roles:
    - role: minecraft_runner
      tags: [minecraft_runner, runner]
