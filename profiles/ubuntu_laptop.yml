---
# Bare-metal Ubuntu laptop — full Docker Engine, TLP power management.
docker_install: true
docker_daemon: true
docker_apt_repo_url: "https://download.docker.com/linux/ubuntu"
install_vscode: true
install_claude_code: true
clone_repos: true

enable_tlp: true               # power role: TLP + ThinkPad charge thresholds + fwupd

# gnome_extensions role: installed from extensions.gnome.org and enabled for the
# user. Values are GVariant text, as `gsettings get` prints them (quoted so
# YAML keeps them strings). Dash to Panel replaces the top bar and Ubuntu Dock
# with one panel per monitor, and turns Ubuntu Dock off itself while it runs.
gnome_extensions:
  - uuid: dash-to-panel@jderose9.github.com
    schema: org.gnome.shell.extensions.dash-to-panel
    settings:
      multi-monitors: "true"     # a panel on every monitor, not just the primary
      panel-position: "'BOTTOM'"

base_extra_packages:
  - openssh-server
base_services:
  - ssh
